const INFLECT = {
  ein:"ein — a/an (indefinite article)", einen:"einen — a (masc., Akk.)", einem:"einem — a (Dat.)", eines:"eines — a (Gen.)",
  eine:"eine — a (fem.)", einer:"einer — a (fem. Dat./Gen.)",
  keinen:"keinen — no (Akk.)", keinem:"keinem — no (Dat.)", keiner:"keiner — no (fem.)", keine:"keine — no (fem./Pl.)",
  den:"den — the (masc., Akk.)", dem:"dem — the (Dat.)", des:"des — the (Gen.)",
  mich:"mich — me (Akk.)", dich:"dich — you (Akk.)", mir:"mir — to me (Dat.)", dir:"dir — to you (Dat.)",
  uns:"uns — us (Akk./Dat.)", euch:"euch — you all (Akk./Dat.)", ihn:"ihn — him (Akk.)", ihm:"ihm — to him (Dat.)",
  ihnen:"ihnen — to them / to you (formal) (Dat.)",
  mein:"mein — my", dein:"dein — your", sein:"sein — his", ihr:"ihr — her / their", unser:"unser — our", euer:"euer — your (pl.)"
};
const CONTR = { im:"in dem", am:"an dem", zum:"zu dem", zur:"zu der", ins:"in das", beim:"bei dem", vom:"von dem", aufs:"auf das", übers:"über das" };
const PHRASE_XLATE = {
  "es gibt":{"en":"there is / there are","ml":"ഉണ്ട് (എവിടെയെങ്കിലും)"},
  "es tut mir leid":{"en":"I'm sorry","ml":"ക്ഷമിക്കണം / എനിക്ക് വിഷമമുണ്ട്"},
  "ich möchte":{"en":"I would like","ml":"എനിക്ക് വേണം / ഞാൻ ആഗ്രഹിക്കുന്നു"},
  "wie viel kostet":{"en":"how much does it cost","ml":"എത്ര വിലയാണ്"},
  "ich heiße":{"en":"my name is","ml":"എന്റെ പേര് … ആണ്"}
};
const norm = s => String(s).toLowerCase().replace(/[-.,!?;:"„“()]/g,"").replace(/\s+/g," ").trim();
/* Malayalam consonant skeleton: strips vowel signs/virama so sandhi forms still match */
const ML_VOWELS = /[ംഃ്ിീുൂെേൈൊോൌൗ]/;
const mlSkel = s => [...String(s)].filter(ch=>!ML_VOWELS.test(ch)).join("");
let VFORMS = null;
function verbForms(){
  if(VFORMS) return VFORMS;
  VFORMS = {};
  Object.keys(DATA.conj).forEach(inf=>{
    const o = DATA.conj[inf];
    (o.forms||[]).forEach((f,i)=>{ const n = norm(f); if(n && !VFORMS[n]) VFORMS[n] = inf+" ("+DATA.pron[i]+")"; });
  });
  return VFORMS;
}
function baseOf(de){ return norm(de.split(",")[0]); }
function matchVocabDe(nc){
  // exact, then without leading article
  return getWords().find(x=>baseOf(x.de)===nc)
      || getWords().find(x=>baseOf(x.de).replace(/^(der|die|das) /,"")===nc && /^(der|die|das) /.test(x.de));
}
function lookupAt(tokens, idx){
  const vf = verbForms();
  for(let len=3; len>=1; len--){
    const cand = tokens.slice(idx, idx+len).join(" ").trim();
    const nc = norm(cand);
    if(!nc) continue;
    const w = matchVocabDe(nc);
    if(w) return {len, w, de:cand};
    if(len===1){
      if(CONTR[nc]){
        const parts = CONTR[nc].split(" ").map(p=>{
          const e = getWords().find(x=>baseOf(x.de)===p);
          return e ? e.en : (INFLECT[p] ? INFLECT[p] : "");
        }).filter(Boolean).join(" + ");
        return {len, de:cand, gloss: CONTR[nc]+" → "+parts};
      }
      if(INFLECT[nc]) return {len, de:cand, gloss: INFLECT[nc]};
      if(vf[nc]) return {len, de:cand, gloss: vf[nc]};
      const w2 = getWords().find(x=> (x.en && x.en.split(/\s+/).map(norm).includes(nc))
          || (x.ml && (norm(x.ml)===nc
              || (nc.length>=4 && nc.startsWith(norm(x.ml)))
              || (mlSkel(nc).length>=3 && mlSkel(nc).startsWith(mlSkel(norm(x.ml)))))));
      if(w2) return {len, w:w2, de:cand};
      return {len, de:cand, missing:true};
    }
  }
  return {len:1, de:tokens[idx], missing:true};
}

let practiceOffset = 0;
function dailyIndex(length){
  const d = new Date();
  const day = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  return ((day + practiceOffset) % length + length) % length;
}

}

const dstr = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function todayStr(){ return dstr(new Date()); }
function yesterdayStr(){ const d=new Date(); d.setDate(d.getDate()-1); return dstr(d); }
function loadDaily(){
  try{
    const d = JSON.parse(localStorage.getItem("dt_daily")||"{}");
    return {last:d.last||"", streak:d.streak||0, xp:d.xp||0, tasks:d.tasks||{}};
  }catch(e){ return {last:"", streak:0, xp:0, tasks:{}}; }
}
let daily = loadDaily();
function saveDaily(){ localStorage.setItem("dt_daily", JSON.stringify(daily)); }
function todayTasks(){ return daily.tasks[todayStr()] || {}; }
function markTask(k, silent){
  const ts = todayStr(), tt = todayTasks();
  if(tt[k]) return;
  tt[k] = true;
  daily.tasks[ts] = tt;
  if(daily.last === ts){ /* already counted today */ }
  else if(daily.last === yesterdayStr()) daily.streak++;
  else daily.streak = 1;
  daily.last = ts;
  daily.xp += 10;
  saveDaily();
  if(!silent) render();
}
function markDay(){
  const ts = todayStr();
  if(daily.last !== ts){
    if(daily.last === yesterdayStr()) daily.streak++;
    else daily.streak = 1;
    daily.last = ts;
    daily.xp += 5;
    saveDaily();
  }
  render();
}
function dayOfYear(){
  const now = new Date();
  return Math.floor((now - new Date(now.getFullYear(),0,0)) / 86400000);
}
function makeQuestion(w, mode){
  let prompt, correct, pool;
  if(mode==="de2en"){ prompt=w.de; correct=w.en; pool=DATA.vocab.map(x=>x.en); }
  else if(mode==="en2de"){ prompt=w.en; correct=w.de; pool=DATA.vocab.map(x=>x.de); }
  else if(mode==="ml2de"){ prompt=w.ml; correct=w.de; pool=DATA.vocab.map(x=>x.de); }
  else { prompt=w.de.replace(/^(der|die|das) /,""); correct=w.de.split(" ")[0]; pool=["der","die","das"]; }
  pool = pool.filter(x=>x!==correct && x && x.length>1);
  const dist = shuffle(pool).slice(0,3);
  const opts = shuffle([correct].concat(dist));
  return {prompt, correct:opts.indexOf(correct), opts, asked:prompt, right:correct, word:w};
}
function buildDailyQuiz(){
  const modes = ["de2en","en2de","ml2de","art"];
  const words = getWords();
  const qs = [];
  for(let i=0;i<10;i++){
    const mode = modes[i % modes.length];
    let pool = words;
    if(mode==="art") pool = words.filter(w=>/^(der|die|das) /.test(w.de));
    if(mode==="ml2de") pool = pool.filter(w=>w.ml && w.ml.length>1);
    if(!pool.length) pool = words;
    const w = pool[Math.floor(Math.random()*pool.length)];
    qs.push(makeQuestion(w, mode));
  }
  quiz = {questions: qs, i:0, correct:0, wrong:0, answered:null, mistakes:[], mode:"daily"};
  render();
}
function startDailyFlash(){
  dailyFlash = true;
  const words = shuffle(getWords()).slice(0,10);
  deck = {cards: words.map(w=>({front:w.de, hint:"", back:w.en, ml:w.ml, cat:w.cat, show:false, key:srsKey(w), de:w.de})), i:0, known:0};
  render();
}

üro"], ["Ich habe gestern im Büro gearbeitet.", "I worked in the office yesterday.", "ഞാൻ ഇന്നലെ ഓഫീസിൽ ജോലി ചെയ്തു.", "Ich + habe + gestern im Büro + gearbeitet"], ["Ich werde morgen im Büro arbeiten.", "I will work in the office tomorrow.", "ഞാൻ നാളെ ഓഫീസിൽ ജോലി ചെയ്യും.", "Ich + werde + morgen im Büro + arbeiten"]]}, {"level": "A2", "title": ["Getting up: separable verb", "എഴുന്നേൽക്കൽ: വേർപിരിയുന്ന ക്രിയ"], "pattern": ["aufstehen separates in the present (stehe … auf). In Perfekt it becomes aufgestanden and takes sein. Futur I uses the full infinitive at the end.", "aufstehen വർത്തമാനത്തിൽ വേർപിരിയും (stehe … auf). Perfekt-ൽ sein-ന്റെ രൂപവും aufgestanden-ഉം ഉപയോഗിക്കുന്നു. Futur I-ൽ പൂർണ infinitive അവസാനം വരും."], "forms": [["Ich stehe heute um sieben Uhr auf.", "I am getting up at seven today.", "ഞാൻ ഇന്ന് ഏഴ് മണിക്ക് എഴുന്നേൽക്കുന്നു.", "Ich + stehe + heute um sieben Uhr + auf"], ["Ich bin gestern um sieben Uhr aufgestanden.", "I got up at seven yesterday.", "ഞാൻ ഇന്നലെ ഏഴ് മണിക്ക് എഴുന്നേറ്റു.", "Ich + bin + gestern um sieben Uhr + aufgestanden"], ["Ich werde morgen um sieben Uhr aufstehen.", "I will get up at seven tomorrow.", "ഞാൻ നാളെ ഏഴ് മണിക്ക് എഴുന്നേൽക്കും.", "Ich + werde + morgen um sieben Uhr + aufstehen"]]}, {"level": "A2", "title": ["Going to the doctor", "ഡോക്ടറുടെ അടുത്തേക്ക് പോകൽ"], "pattern": ["gehen usually uses sein in Perfekt to express movement. The participle is gegangen.", "ചലനം സൂചിപ്പിക്കുന്ന gehen-ന് Perfekt-ൽ സാധാരണ sein ഉപയോഗിക്കുന്നു. Partizip II: gegangen."], "forms": [["Ich gehe heute zum Arzt.", "I am going to the doctor today.", "ഞാൻ ഇന്ന് ഡോക്ടറുടെ അടുത്തേക്ക് പോകുന്നു.", "Ich + gehe + heute zum Arzt"], ["Ich bin gestern zum Arzt gegangen.", "I went to the doctor yesterday.", "ഞാൻ ഇന്നലെ ഡോക്ടറുടെ അടുത്തേക്ക് പോയി.", "Ich + bin + gestern zum Arzt + gegangen"], ["Ich werde morgen zum Arzt gehen.", "I will go to the doctor tomorrow.", "ഞാൻ നാളെ ഡോക്ടറുടെ അടുത്തേക്ക് പോകും.", "Ich + werde + morgen zum Arzt + gehen"]]}, {"level": "A2", "title": ["Shopping: separable verb", "സാധനങ്ങൾ വാങ്ങൽ: വേർപിരിയുന്ന ക്രിയ"], "pattern": ["einkaufen separates as kaufe … ein. Its past participle is eingekauft; Perfekt uses haben.", "einkaufen, kaufe … ein ആയി വേർപിരിയും. ഇതിന്റെ Partizip II eingekauft ആണ്; Perfekt-ൽ haben ഉപയോഗിക്കുന്നു."], "forms": [["Ich kaufe heute im Supermarkt ein.", "I am shopping at the supermarket today.", "ഞാൻ ഇന്ന് സൂപ്പർമാർക്കറ്റിൽ നിന്ന് സാധനങ്ങൾ വാങ്ങുന്നു.", "Ich + kaufe + heute im Supermarkt + ein"], ["Ich habe gestern im Supermarkt eingekauft.", "I shopped at the supermarket yesterday.", "ഞാൻ ഇന്നലെ സൂപ്പർമാർക്കറ്റിൽ നിന്ന് സാധനങ്ങൾ വാങ്ങി.", "Ich + habe + gestern im Supermarkt + eingekauft"], ["Ich werde morgen im Supermarkt einkaufen.", "I will shop at the supermarket tomorrow.", "ഞാൻ നാളെ സൂപ്പർമാർക്കറ്റിൽ നിന്ന് സാധനങ്ങൾ വാങ്ങും.", "Ich + werde + morgen im Supermarkt + einkaufen"]]}, {"level": "B1", "title": ["Giving a reason with weil", "weil ഉപയോഗിച്ച് കാരണം പറയൽ"], "pattern": ["A weil-clause sends its conjugated verb to the end. In the past example, the main clause uses Perfekt and the reason uses war (Präteritum of sein).", "weil ഉപയോഗിച്ചുള്ള ഉപവാക്യത്തിൽ രൂപം മാറിയ ക്രിയ അവസാനം വരും. ഭൂതകാല ഉദാഹരണത്തിൽ പ്രധാന വാക്യം Perfekt-ലും കാരണം war (sein-ന്റെ Präteritum) ഉപയോഗിച്ചുമാണ്."], "forms": [["Ich bleibe heute zu Hause, weil ich krank bin.", "I am staying at home today because I am ill.", "എനിക്ക് അസുഖമായതിനാൽ ഞാൻ ഇന്ന് വീട്ടിൽ തങ്ങുന്നു.", "Ich + bleibe + heute zu Hause, weil + ich krank + bin"], ["Ich bin gestern zu Hause geblieben, weil ich krank war.", "I stayed at home yesterday because I was ill.", "എനിക്ക് അസുഖമായിരുന്നതിനാൽ ഞാൻ ഇന്നലെ വീട്ടിൽ തങ്ങി.", "Ich + bin + gestern zu Hause + geblieben, weil + ich krank + war"], ["Ich werde morgen zu Hause bleiben, weil ich krank bin.", "I will stay at home tomorrow because I am ill.", "എനിക്ക് അസുഖമായതിനാൽ ഞാൻ നാളെ വീട്ടിൽ തങ്ങും.", "Ich + werde + morgen zu Hause + bleiben, weil + ich krank + bin"]]}, {"level": "B1", "title": ["Reporting with dass", "dass ഉപയോഗിച്ച് പറയൽ"], "pattern": ["In a dass-clause, the finite verb goes to the end: lernt / gelernt hat / lernen wird. The main clause stays in the present.", "dass ഉപവാക്യത്തിൽ രൂപം മാറിയ ക്രിയ അവസാനം വരും: lernt / gelernt hat / lernen wird. പ്രധാന വാക്യം വർത്തമാനത്തിൽ തന്നെയാണ്."], "forms": [["Ich glaube, dass er heute Deutsch lernt.", "I think that he is learning German today.", "അവൻ ഇന്ന് ജർമ്മൻ പഠിക്കുന്നുവെന്ന് ഞാൻ കരുതുന്നു.", "Ich glaube, dass + er heute Deutsch + lernt"], ["Ich glaube, dass er gestern Deutsch gelernt hat.", "I think that he learned German yesterday.", "അവൻ ഇന്നലെ ജർമ്മൻ പഠിച്ചുവെന്ന് ഞാൻ കരുതുന്നു.", "Ich glaube, dass + er gestern Deutsch + gelernt hat"], ["Ich glaube, dass er morgen Deutsch lernen wird.", "I think that he will learn German tomorrow.", "അവൻ നാളെ ജർമ്മൻ പഠിക്കുമെന്ന് ഞാൻ കരുതുന്നു.", "Ich glaube, dass + er morgen Deutsch + lernen wird"]]}, {"level": "B1", "title": ["Expressing purpose with um … zu", "um … zu ഉപയോഗിച്ച് ഉദ്ദേശ്യം പറയൽ"], "pattern": ["The purpose phrase um … zu + infinitive comes after the main clause. Its infinitive stays at the end in all three examples.", "ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന um … zu + infinitive പ്രധാന വാക്യത്തിന് ശേഷം വരും. മൂന്ന് ഉദാഹരണങ്ങളിലും infinitive അവസാനം തന്നെയായിരിക്കും."], "forms": [["Ich gehe heute in die Bibliothek, um Deutsch zu lernen.", "I am going to the library today to learn German.", "ജർമ്മൻ പഠിക്കാനായി ഞാൻ ഇന്ന് ലൈബ്രറിയിലേക്ക് പോകുന്നു.", "Ich + gehe + heute in die Bibliothek, um + Deutsch + zu lernen"], ["Ich bin gestern in die Bibliothek gegangen, um Deutsch zu lernen.", "I went to the library yesterday to learn German.", "ജർമ്മൻ പഠിക്കാനായി ഞാൻ ഇന്നലെ ലൈബ്രറിയിലേക്ക് പോയി.", "Ich + bin + gestern in die Bibliothek + gegangen, um + Deutsch + zu lernen"], ["Ich werde morgen in die Bibliothek gehen, um Deutsch zu lernen.", "I will go to the library tomorrow to learn German.", "ജർമ്മൻ പഠിക്കാനായി ഞാൻ നാളെ ലൈബ്രറിയിലേക്ക് പോകും.", "Ich + werde + morgen in die Bibliothek + gehen, um + Deutsch + zu lernen"]]}];
const tenseNames = u => [u.tensePresent,u.tensePast,u.tenseFuture];
function sentenceList(){ return SENTENCE_PATTERNS.filter(x=>x.level===sentenceLevel); }
function setSentenceLevel(level){ sentenceLevel=level; sentenceExample=0; sentenceTense=0; render(); }
function sentenceSelectExample(el){ sentenceExample=Number(el.value); renderSentencePractice(); }
function sentenceSelectTense(el){ sentenceTense=Number(el.value); renderSentencePractice(); }
function normalizeSentence(s){ return s.normalize('NFC').trim().toLocaleLowerCase('de-DE').replace(/[.!?]+$/u,'').replace(/\s+/gu,' '); }
function checkSentence(){
  const u=t(), value=document.getElementById('sentenceInput').value;
  const result=document.getElementById('sentenceFeedback');
  if(!value.trim()){ result.textContent=u.sentenceEmpty; return; }
  const expected=sentenceList()[sentenceExample].forms[sentenceTense][0];
  result.textContent=normalizeSentence(value)===normalizeSentence(expected)?u.sentenceCorrect:u.sentenceDifferent;
}
function renderSentencePractice(){
  const u=t(), ix=lang==='ml'?1:0, list=sentenceList(), selected=list[sentenceExample], f=selected.forms[sentenceTense];
  document.getElementById('sentencePractice').innerHTML=`
    <h3>✍️ ${u.sentencePractice}</h3>
    <div class="searchbar">
      <label>${u.sentenceChoose}<br><select id="sentenceExample" onchange="sentenceSelectExample(this)" style="padding:8px;max-width:100%;">${list.map((x,i)=>`<option value="${i}" ${i===sentenceExample?'selected':''}>${esc(x.title[ix])}</option>`).join('')}</select></label>
      <label>${u.sentenceTense}<br><select id="sentenceTense" onchange="sentenceSelectTense(this)" style="padding:8px;max-width:100%;">${tenseNames(u).map((name,i)=>`<option value="${i}" ${i===sentenceTense?'selected':''}>${name}</option>`).join('')}</select></label>
    </div>
    <p><b>${u.sentencePrompt}:</b><br>${esc(f[1])}<br>${esc(f[2])}</p>
    <label for="sentenceInput" style="display:block;margin-top:12px;">${u.sentenceInput}</label>
    <textarea id="sentenceInput" rows="2" lang="de" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;" autocomplete="off"></textarea>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px;"><button class="btn gold" onclick="checkSentence()">${u.sentenceCheck}</button><details><summary style="cursor:pointer;">${u.sentenceShow}</summary><b lang="de">${esc(f[0])}</b><br>${esc(f[3])}</details></div>
    <p id="sentenceFeedback" role="status" aria-live="polite" style="margin-top:10px;"></p>`;
}
function renderSentences(){
  const u=t(), ix=lang==='ml'?1:0;
  main.innerHTML=`
    <div class="card"><h2>${u.sentenceTitle}</h2><p>${u.sentenceIntro}</p><div style="margin-top:12px;">${['A1','A2','B1'].map(level=>`<button class="chip ${sentenceLevel===level?'active':''}" onclick="setSentenceLevel('${level}')">${level}</button>`).join('')}</div><div class="note">${u.sentenceNote}</div></div>
    <div class="card" id="sentencePractice"></div>
    ${sentenceList().map(x=>`<div class="card"><h3><span class="badge ${x.level.toLowerCase()}">${x.level}</span>${esc(x.title[ix])}</h3><p><b>${u.sentencePattern}:</b> ${esc(x.pattern[ix])}</p>${x.forms.map((f,i)=>`<div class="phrase" style="margin-top:12px;"><span class="badge">${tenseNames(u)[i]}</span><div class="de" lang="de">${esc(f[0])}</div><div class="en">${esc(f[1])}</div><div class="ml">${esc(f[2])}</div><div class="muted" style="margin-top:6px;"><b>${u.sentenceParts}:</b> ${esc(f[3])}</div></div>`).join('')}</div>`).join('')}`;
  renderSentencePractice();
}

/* ============ Boot ============ */
function openLevelWord(i){
  const w=getWords().filter(x=>x.lvl===levelLvl)[i];
  if(w) openWord("reg", w.de, w.cat);
}
function practiseLevel(kind){
  const words=getWords().filter(w=>w.lvl===levelLvl);
  if(!words.length) return;
  if(kind==="cards"){
    deck={cards:shuffle(words).map(w=>({front:w.de, hint:"", back:w.en, ml:w.ml, cat:w.cat, show:false, key:srsKey(w), de:w.de})), i:0, known:0};
    go("cards");
    return;
  }
  const qs=shuffle(words).slice(0,10).map(w=>makeQuestion(w,"de2en"));
  quiz={questions:qs, i:0, correct:0, wrong:0, answered:null, mistakes:[], mode:"level"};
  go("quiz");
}

function renderLevels(){
  const u=t();
  const lv=levelLvl;
  const bands=[["A1","A1"],["A2","A2"],["B1","B1"],["A1A2","A1–A2"]];
  const words=getWords().filter(w=>w.lvl===lv);
  const pats=(DATA.wortbildung||[]).filter(p=>p.lvl===lv);
  const shown=words.slice(0, levelLimit);
  main.innerHTML=`
    <div class="card">
      <h2>${u.lvlTitle}</h2><p class="muted">${u.lvlLead}</p>
      <div style="margin-top:10px;">${bands.map(([val,label])=>`<button class="chip ${lv===val?'active':''}" onclick="setLevel('${val}')">${label}</button>`).join("")}</div>
      <p class="muted" style="margin-top:8px;">${words.length} ${u.statsWords} · ${pats.length} ${u.lvlPatterns}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
        <button class="btn gold" onclick="practiseLevel('cards')">🃏 ${u.lvlPracticeDeck}</button>
        <button class="btn" onclick="practiseLevel('quiz')">📝 ${u.lvlPracticeQuiz}</button>
      </div>
    </div>
    <div class="card">
      <h3>${u.lvlWords}</h3>
      ${shown.map((w,i)=>`<div class="vrow" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}" onclick="openLevelWord(${i})">
        <div class="de">${formatDe(w.de)}${w.pl?` <span class="muted" style="font-weight:400;">(${esc(w.pl)})</span>`:""}</div>
        <div class="en">${esc(w.en)}</div><div class="ml" lang="ml">${esc(w.ml)}</div>
        <span class="badge ${w.lvl.toLowerCase()}">${w.lvl==="A1A2"?"A1–A2":w.lvl}</span></div>`).join("")}
      ${words.length>shown.length?`<div class="empty"><button class="btn ghost" onclick="levelLimit+=200;render()">${u.showMore} (${words.length-shown.length})</button></div>`:""}
    </div>
    ${pats.length?`<div class="card">
      <h3>${u.lvlPatterns}</h3>
      ${pats.map(p=>`<div class="phrase" style="margin-top:12px;">
        <div class="de">${p.icon} ${esc(p.title[lang])}</div>
        <p class="muted" style="margin:6px 0;">${esc(p.rule[lang])}</p>
        <ul class="examples">${p.ex.map(e=>`<li><span class="de" lang="de">${esc(e[0])}</span> — ${esc(lang==="ml"?e[2]:e[1])}</li>`).join("")}</ul>
      </div>`).join("")}
    </div>`:""}`;
}
function setLevel(l){ levelLvl=l; levelLimit=200; go("levels", l); }

function renderTab(){
  const el=document.getElementById("main");
  el.innerHTML="";
  const u=t();
  if(tab==="start") renderStart();
  else if(tab==="daily") renderDaily();
  else if(tab==="sentences") renderSentences();
  else if(tab==="levels") renderLevels();
  else if(tab==="grammar") renderGrammar();
  else if(tab==="vocab") renderVocab();
  else if(tab==="cards") renderCards();
  else if(tab==="quiz") renderQuiz();
  else if(tab==="phrases") renderPhrases();
  else if(tab==="ask") renderAsk();
  document.getElementById("footerNote").innerHTML = u.footerNote;
}
applyHash(); render();
</script>
