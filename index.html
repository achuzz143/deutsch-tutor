<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsch Tutor — ജർമ്മൻ പഠിക്കാം</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c2230">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deutsch Tutor">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --red:#d21f26; --gold:#ffce00; --dark:#1c2230; --ink:#2b3447;
    --bg:#f4f6fb; --card:#ffffff; --line:#e4e8f2; --muted:#6b7590;
    --blue:#2b6cb0; --green:#2f855a; --violet:#6b46c1; --ok:#2f855a; --no:#c53030;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Noto Sans Malayalam","Malayalam MN","Nirmala UI",sans-serif;
       background:var(--bg); color:var(--ink); line-height:1.55;}
  header.hero{background:linear-gradient(120deg,#1c2230 0%,#2b3447 55%,#3d2f4d 100%); color:#fff;
       padding:22px 20px 14px; border-bottom:5px solid var(--gold);}
  .hero-in{max-width:1060px; margin:0 auto; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .flag{font-size:34px; line-height:1;}
  .hero h1{font-size:22px; letter-spacing:.3px;}
  .hero p{font-size:13px; color:#cfd6e6;}
  .hero .right{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .langbtn{border:1px solid #4a5468; background:#333c52; color:#fff; border-radius:20px; padding:6px 14px;
       font-size:13px; cursor:pointer;}
  .langbtn.active{background:var(--gold); color:#231f10; border-color:var(--gold); font-weight:700;}
  .hsearch{display:flex; gap:6px;}
  .hsearch input{border:1px solid #4a5468; background:#232b3d; color:#fff; border-radius:20px; padding:7px 14px; width:210px; font-size:13px; outline:none;}
  .hsearch input::placeholder{color:#9aa5bd;}
  nav.tabs{background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:50; overflow-x:auto;}
  .tabs-in{max-width:1060px; margin:0 auto; display:flex; gap:2px;}
  .tab{padding:12px 16px; font-size:14px; cursor:pointer; color:var(--muted); white-space:nowrap; border-bottom:3px solid transparent; background:none; border-top:none; border-left:none; border-right:none;}
  .tab:hover{color:var(--ink); background:#f8f9fd;}
  .tab.active{color:var(--red); border-bottom-color:var(--red); font-weight:700;}
  main{max-width:1060px; margin:0 auto; padding:22px 16px 60px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px;
       box-shadow:0 1px 3px rgba(28,34,48,.05);}
  .grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px;}
  h2{font-size:20px; margin-bottom:6px;}
  h3{font-size:16px; margin:14px 0 6px;}
  .muted{color:var(--muted); font-size:13.5px;}
  .badge{display:inline-block; background:#eef1f8; color:var(--muted); border-radius:12px; padding:2px 10px; font-size:12px; font-weight:600; margin-right:6px;}
  .badge.a1{background:#e6f6ec; color:var(--green);}
  .badge.a2{background:#eaf2fb; color:var(--blue);}
  .badge.b1{background:#f3eefd; color:var(--violet);}
  .chip{border:1px solid var(--line); background:#fff; border-radius:18px; padding:6px 14px; font-size:13px; cursor:pointer; margin:0 6px 8px 0;}
  .chip.active{background:var(--dark); color:#fff; border-color:var(--dark); font-weight:600;}
  .btn{background:var(--dark); color:#fff; border:none; border-radius:10px; padding:10px 18px; font-size:14px; cursor:pointer; font-weight:600;}
  .btn:hover{filter:brightness(1.15);}
  .btn.gold{background:var(--gold); color:#231f10;}
  .btn.red{background:var(--red);}
  .btn.ghost{background:#fff; color:var(--ink); border:1px solid var(--line);}
  .btn:disabled{opacity:.45; cursor:default; filter:none;}
  table{border-collapse:collapse; width:100%; margin:8px 0; font-size:14px;}
  th,td{border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top;}
  th{background:#f2f4fa; font-size:13px;}
  .examples li{margin:6px 0 6px 18px;}
  .examples .de{font-weight:700; color:var(--red);}
  .note{background:#fff8e1; border-left:4px solid var(--gold); border-radius:0 10px 10px 0; padding:10px 14px; margin:12px 0; font-size:14px;}
  .tip{background:#eef7f2; border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:10px 14px; margin:12px 0; font-size:14px;}
  .art-der{color:var(--blue); font-weight:700;} .art-die{color:var(--red); font-weight:700;} .art-das{color:var(--green); font-weight:700;}
  .vrow{display:flex; gap:10px; align-items:center; border-bottom:1px solid var(--line); padding:10px 6px; cursor:pointer; font-size:14px;}
  .vrow:hover{background:#f8f9fd;}
  .vrow .de{font-weight:700; min-width:170px;}
  .vrow .en{flex:1; color:#3c4661;}
  .vrow .ml{flex:1; color:var(--muted);}
  .vrow .cat{font-size:11px; background:#eef1f8; padding:2px 8px; border-radius:10px; color:var(--muted); white-space:nowrap;}
  .searchbar{display:flex; gap:8px; margin:10px 0 14px; flex-wrap:wrap;}
  .searchbar input{flex:1; min-width:220px; border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:14px; outline:none;}
  .searchbar input:focus{border-color:var(--blue);}
  .fc{perspective:1200px; margin:14px auto; max-width:520px;}
  .fcard{position:relative; width:100%; min-height:250px; transform-style:preserve-3d; transition:transform .5s; cursor:pointer;}
  .fcard.flipped{transform:rotateY(180deg);}
  .fcard .face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:16px;
       display:flex; flex-direction:column; align-items:center; justify-content:center; padding:26px; text-align:center;}
  .fcard .front{background:linear-gradient(140deg,#1c2230,#3d2f4d); color:#fff;}
  .fcard .back{background:#fff; border:2px solid var(--gold); transform:rotateY(180deg);}
  .fcard .big{font-size:30px; font-weight:800; margin-bottom:8px;}
  .fcard .sub{font-size:15px; color:#c9d2e4;}
  .fc-btns{display:flex; gap:10px; justify-content:center; margin-top:12px;}
  .fc-btns .btn{flex:1; max-width:190px;}
  .progress{height:8px; background:#e8ebf4; border-radius:6px; overflow:hidden; margin:8px 0;}
  .progress > div{height:100%; background:var(--green); transition:width .3s;}
  .qbox{max-width:640px; margin:0 auto;}
  .qprompt{font-size:26px; font-weight:800; text-align:center; margin:10px 0 20px;}
  .qopts{display:grid; gap:10px;}
  .qopt{border:1px solid var(--line); background:#fff; border-radius:12px; padding:13px 16px; font-size:15px; cursor:pointer; text-align:left;}
  .qopt:hover{border-color:var(--blue); background:#f5f9ff;}
  .qopt.correct{border-color:var(--ok); background:#eef9f2; font-weight:700;}
  .qopt.wrong{border-color:var(--no); background:#fdf0f0;}
  .qopt:disabled{cursor:default;}
  .phrase{border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; background:#fff;}
  .phrase .row{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .phrase .de{font-size:17px; font-weight:800;}
  .phrase .en{color:#3c4661; font-size:14px;}
  .phrase .ml{color:var(--muted); font-size:14px;}
  .play{border:none; background:var(--dark); color:#fff; border-radius:50%; width:38px; height:38px; font-size:15px; cursor:pointer; flex-shrink:0;}
  .play:hover{filter:brightness(1.2);}
  .askresult{border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; background:#fff; cursor:pointer;}
  .askresult:hover{border-color:var(--blue);}
  .askresult .k{font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); font-weight:700;}
  .askresult .t{font-weight:700; margin:2px 0;}
  .modal-ov{position:fixed; inset:0; background:rgba(20,24,34,.55); display:none; align-items:center; justify-content:center; z-index:100; padding:18px;}
  .modal-ov.open{display:flex;}
  .modal{background:#fff; border-radius:16px; max-width:560px; width:100%; max-height:86vh; overflow:auto; padding:24px;}
  .modal h2{margin-bottom:10px;}
  .statbox{background:linear-gradient(140deg,#1c2230,#3d2f4d); color:#fff; border-radius:14px; padding:18px; text-align:center;}
  .statbox .n{font-size:30px; font-weight:800; color:var(--gold);}
  .statbox .l{font-size:12.5px; color:#c9d2e4;}
  .path-item{display:flex; gap:12px; padding:9px 0; border-bottom:1px dashed var(--line); font-size:14px;}
  .path-item:hover{background:#f6f8fd;}
  .path-item .w{font-weight:800; color:var(--red); min-width:86px;}
  .ltsent{font-size:15px; font-weight:600; margin:6px 0;}
  .ltchip{display:inline-flex; flex-direction:column; gap:1px; background:#f8f9fd; border:1px solid var(--line); border-radius:10px; padding:6px 10px; font-size:13px; max-width:300px;}
  .ltchip .tok{font-weight:800; color:var(--red);}
  .ltchip .gl{color:#3c4661;}
  .ltchip .glm{color:var(--muted); font-size:12px;}
  .ltchip.ltunk{border-color:#f0c8c8; background:#fdf6f6;}
  .ltchip.ltunk .tok{color:var(--no);}
  .gram-side{display:flex; gap:16px; flex-wrap:wrap;}
  .gram-nav{width:250px; flex-shrink:0;}
  .gram-nav .g{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); font-weight:800; margin:14px 0 4px;}
  .gram-nav button{display:block; width:100%; text-align:left; border:none; background:none; padding:8px 10px; border-radius:8px; font-size:13.5px; color:var(--ink); cursor:pointer;}
  .gram-nav button:hover{background:#eef1f8;}
  .gram-nav button.active{background:var(--dark); color:#fff; font-weight:600;}
  .gram-body{flex:1; min-width:300px;}
  .gram-body .lead{font-size:15px; margin:10px 0;}
  footer{max-width:1060px; margin:0 auto; padding:0 16px 34px; font-size:12.5px; color:var(--muted);}
  .hide{display:none !important;}
  .empty{padding:30px; text-align:center; color:var(--muted);}
  .selrow{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:6px 0;}
  .selrow label{font-size:13.5px; font-weight:600; min-width:120px;}
  select{border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:14px; background:#fff;}
  input[type=text]{border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:14px; outline:none;}
  input[type=text]:focus{border-color:var(--blue);}
  .score-big{font-size:44px; font-weight:800; text-align:center; margin:6px 0;}
  @media (max-width:720px){
    .gram-nav{width:100%;}
    .vrow .ml{display:none;}
    .hsearch input{width:140px;}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-in">
    <div class="flag">🇩🇪</div>
    <div>

<footer>

  grammar: [{"id": "alphabet", "group": "Basics", "level": "A1", "icon": "🔤", "title": "Alphabet & Pronunciation", "en": "German uses the 26 Latin letters plus three umlauts (ä, ö, ü) and the special letter ß (called \"Eszett\"). Pronunciation is very regular: once you know the sounds, you can read almost any word correctly.", "ml": "ജർമ്മൻ ഭാഷയിൽ 26 ലാറ്റിൻ അക്ഷരങ്ങൾക്ക് പുറമേ മൂന്ന് ഉംലോട്ട് സ്വരാക്ഷരങ്ങൾ (ä, ö, ü) ഒപ്പം ß എന്ന പ്രത്യേക അക്ഷരവും ഉണ്ട്. ß 'എസ്സെറ്റ്സ്' എന്ന് വിളിക്കും, ഇത് ഇരട്ട s പോലെ ഉച്ചരിക്കും. ജർമ്മൻ ഉച്ചാരണം വളരെ ക്രമമാണ് — നിയമങ്ങൾ പഠിച്ചാൽ ഏത് വാക്കും വായിക്കാം!", "blocks": [{"t": "text", "en": "Key letter sounds (with Malayalam hints):", "ml": "പ്രധാന അക്ഷര ഉച്ചാരണങ്ങൾ (മലയാളം സൂചനകളോടെ):"}, {"t": "table", "headers": ["German", "Sound", "മലയാളം hint"], "rows": [["ei", "like 'eye'", "ഐ (k-ഐ-l) — ഉദാ. nein"], ["ie", "like 'ee'", "ഈ — ഉദാ. sie (അവൾ)"], ["eu / äu", "like 'oy'", "ഓയ് — ഉദാ. neun (ഒമ്പത്)"], ["sch", "like 'sh'", "ഷ — ഉദാ. Schule (സ്കൂൾ)"], ["sp / st (വാക്കിന്റെ തുടക്കത്തിൽ)", "'shp' / 'sht'", "ഷ്പ / ഷ്ട — ഉദാ. sprechen"], ["z", "like 'ts'", "സ്സ് (ts) — ഉദാ. Zeit (സമയം)"], ["w", "like 'v'", "വ് — ഉദാ. Wasser (വെള്ളം)"], ["v", "like 'f'", "ഫ് — ഉദാ. Vater (അച്ഛൻ)"], ["j", "like 'y'", "യ് — ഉദാ. ja (അതെ)"], ["ch (i, e ശേഷം)", "soft, like 'h' in hue", "ഇഹ് — ഉദാ. ich (ഞാൻ)"], ["ch (a, o, u ശേഷം)", "hard, like 'kh'", "ഖ് — ഉദാ. Nacht (രാത്രി)"], ["ß", "sharp 's'", "ദീർഘ 's' — ഉദാ. groß (വലിയ)"], ["ä", "like 'e' in bed", "എ — ഉദാ. spät (വൈകി)"], ["ö", "like 'u' in nurse (lips rounded)", "'എ' പറയുമ്പോൾ ചുണ്ട് വട്ടത്തിൽ — ഉദാ. schön"], ["ü", "like French 'u', lips rounded 'ee'", "'ഈ' പറയുമ്പോൾ ചുണ്ട് വട്ടത്തിൽ — ഉദാ. über"]]}, {"t": "note", "en": "The letter combination \"ch\" has two sounds: soft after e/i (ich ≈ ഇഹ്) and hard after a/o/u (Nacht ≈ നഖ്ത്).", "ml": "ch എന്നതിന് രണ്ട് ഉച്ചാരണം: e/i ശേഷം മൃദുവായി (ich), a/o/u ശേഷം കഠിനമായി (Nacht)."}], "tip": {"en": "Always learn the article (der/die/das) together with every noun — it's not optional in German!", "ml": "ഓരോ നാമവും പഠിക്കുമ്പോൾ അതിന്റെ കൂടെ der/die/das (ആർട്ടിക്കിൾ) കൂടി പഠിക്കുക — ജർമ്മനിൽ അത് നിർബന്ധമാണ്!"}}, {"id": "gender", "group": "Basics", "level": "A1", "icon": "🚻", "title": "Nouns & Gender: der / die / das", "en": "Every German noun has a gender: masculine (der), feminine (die) or neuter (das). There is no single rule, but many endings give strong hints. Always learn the article with the noun!", "ml": "ജർമ്മൻ ഭാഷയിൽ ഓരോ നാമത്തിനും ഒരു ലിംഗം ഉണ്ട്: പുല്ലിംഗം (der), സ്ത്രീലിംഗം (die), നപുംസകലിംഗം (das). ഒറ്റ നിയമമില്ല, പക്ഷേ അവസാന അക്ഷരങ്ങൾ (endings) പലപ്പോഴും സൂചന തരും. എപ്പോഴും നാമത്തോടൊപ്പം ആർട്ടിക്കിളും പഠിക്കുക!", "blocks": [{"t": "table", "headers": ["Ending", "Gender", "Examples"], "rows": [["-ung, -heit, -keit, -schaft, -tion, -ei", "die (feminine)", "die Zeitung (പത്രം), die Freiheit (സ്വാതന്ത്ര്യം), die Freundschaft (സൗഹൃദം)"], ["-er, -ling, -ismus (mostly)", "der (masculine)", "der Lehrer (അധ്യാപകൻ), der Flughafen (വിമാനത്താവളം)"], ["-chen, -lein, -ment, -um", "das (neuter)", "das Mädchen (പെൺകുട്ടി), das Zimmer (മുറി), das Museum (മ്യൂസിയം)"], ["Days, months, seasons, weather", "der", "der Montag, der Januar, der Sommer, der Regen"], ["-e (mostly), fruits & flowers", "die", "die Lampe (വിളക്ക്), die Banane, die Rose"]]}, {"t": "examples", "items": [["der Mann", "the man"], ["die Frau", "the woman"], ["das Kind", "the child"]]}], "tip": {"en": "German nouns are ALWAYS written with a capital letter — even in the middle of a sentence!", "ml": "ജർമ്മൻ നാമങ്ങൾ എപ്പോഴും വലിയ അക്ഷരത്തിൽ എഴുതണം — വാക്യത്തിന്റെ നടുവിലാണെങ്കിൽ പോലും!"}}, {"id": "ein", "group": "Basics", "level": "A1", "icon": "1️⃣", "title": "Indefinite Articles: ein / eine / ein & kein", "en": "\"Ein\" means \"a/an\" (or \"one\"). It changes with the noun's gender: ein (masculine), eine (feminine), ein (neuter). \"Kein\" means \"no / not a\" and follows the same pattern.", "ml": "ein എന്നാൽ 'ഒരു' എന്നാണ്. ലിംഗമനുസരിച്ച് മാറും: ein (പുല്ലിംഗം), eine (സ്ത്രീലിംഗം), ein (നപുംസകം). kein എന്നാൽ 'ഒരു...ഇല്ല / ഇല്ല' — ഇതും അതേ രീതിയിൽ മാറും.", "blocks": [{"t": "table", "headers": ["Gender", "a/an", "no / not a", "Example"], "rows": [["masculine", "ein", "kein", "ein Mann — kein Mann"], ["feminine", "eine", "keine", "eine Frau — keine Frau"], ["neuter", "ein", "kein", "ein Kind — kein Kind"], ["plural", "— (no word)", "keine", "— Kinder / keine Kinder"]]}, {"t": "examples", "items": [["Das ist ein Buch.", "This is a book."], ["Ich habe keine Zeit.", "I have no time."], ["Er ist kein Arzt.", "He is not a doctor."]]}], "tip": {"en": "Use kein (not nicht) to negate a noun that would otherwise have ein or no article.", "ml": "ein ഉള്ള നാമത്തെ നിഷേധിക്കാൻ nicht അല്ല, kein ആണ് ഉപയോഗിക്കേണ്ടത്."}}, {"id": "cases1", "group": "Basics", "level": "A1", "icon": "🎯", "title": "Cases 1: Nominative & Accusative", "en": "German has 4 cases. The nominative is the subject (who does the action), the accusative is the direct object (who/what receives the action). Only the masculine article changes in the accusative: der → den, ein → einen.", "ml": "ജർമ്മനിൽ 4 കേസുകൾ (വിഭക്തികൾ) ഉണ്ട്. Nominative = കർത്താവ് (ചെയ്യുന്നയാൾ), Accusative = കർമ്മം (ഏത് വസ്തുവിനെയോ ആളെയോ). Accusative-ൽ പുല്ലിംഗ ആർട്ടിക്കിൾ മാത്രം മാറും: der → den, ein → einen.", "blocks": [{"t": "table", "headers": ["", "der/ein", "die/eine", "das/ein", "plural"], "rows": [["Nominative (കർത്താവ്)", "der Mann / ein Mann", "die Frau / eine Frau", "das Kind / ein Kind", "die Kinder"], ["Accusative (കർമ്മം)", "den Mann / einen Mann", "die Frau / eine Frau", "das Kind / ein Kind", "die Kinder"]]}, {"t": "examples", "items": [["Der Hund beißt den Mann.", "The dog bites the man. (der → den)"], ["Ich sehe die Frau.", "I see the woman. (no change)"], ["Er kauft ein Auto.", "He buys a car. (ein → einen)"]]}, {"t": "note", "en": "Typical accusative verbs: sehen (see), kaufen (buy), haben (have), essen (eat), lieben (love), brauchen (need), finden (find).", "ml": "Accusative എടുക്കുന്ന സാധാരണ ക്രിയകൾ: sehen (കാണുക), kaufen (വാങ്ങുക), haben (ഉണ്ടായിരിക്കുക), essen (കഴിക്കുക), lieben (സ്നേഹിക്കുക), brauchen (ആവശ്യമുണ്ടാകുക), finden (കണ്ടെത്തുക)."}], "tip": {"en": "Ask \"wen?\" (whom?) to find the accusative object: Ich sehe wen? → den Mann.", "ml": "Accusative കണ്ടുപിടിക്കാൻ 'ആരെ? / എന്തിനെ?' എന്ന് ചോദിക്കുക: Ich sehe wen? → den Mann."}}, {"id": "cases2", "group": "Basics", "level": "A2", "icon": "🎁", "title": "Cases 2: Dative & Genitive", "en": "The dative is the indirect object (to/for whom). The genitive shows possession (whose). Dative articles: dem/einem, der/einer, dem/einem, den (+ -n on plural nouns). Genitive: des/eines, der/einer, des/eines, der.", "ml": "Dative = പ്രയോജകാരകം ('ആർക്ക്/എന്തിന്' എന്ന് ചോദിച്ചാൽ കിട്ടുന്നത്). Genitive = സംബന്ധിക ('ആരുടെ'). Dative ആർട്ടിക്കിളുകൾ: dem/einem, der/einer, dem/einem, den (+ ബഹുവചന നാമത്തിന് -n). Genitive: des/eines, der/einer, des/eines, der.", "blocks": [{"t": "table", "headers": ["", "der/ein", "die/eine", "das/ein", "plural"], "rows": [["Dative (ആർക്ക്?)", "dem Mann / einem Mann", "der Frau / einer Frau", "dem Kind / einem Kind", "den Kindern"], ["Genitive (ആരുടെ?)", "des Mannes / eines Mannes", "der Frau / einer Frau", "des Kindes / eines Kindes", "der Kinder"]]}, {"t": "examples", "items": [["Ich helfe dem Lehrer.", "I help the teacher. (helfen + dative)"], ["Das Buch des Lehrers ist neu.", "The teacher's book is new."], ["Ich danke dir.", "I thank you (to you)."]]}, {"t": "note", "en": "Verbs that take dative: helfen (help), danken (thank), antworten (answer), gefallen (please), gehören (belong to).", "ml": "Dative എടുക്കുന്ന ക്രിയകൾ: helfen (സഹായിക്കുക), danken (നന്ദി പറയുക), antworten (ഉത്തരം പറയുക), gefallen (ഇഷ്ടപ്പെടുക), gehören (സ്വന്തമായിരിക്കുക)."}], "tip": {"en": "In everyday speech Germans often say \"das Buch vom Lehrer\" instead of genitive — but genitive is the correct written form.", "ml": "സംസാരഭാഷയിൽ 'vom Lehrer' പറയും, പക്ഷേ എഴുത്തിൽ genitive (des Lehrers) ആണ് ശരി."}}, {"id": "pronouns", "group": "Basics", "level": "A1", "icon": "👤", "title": "Personal Pronouns", "en": "German has a formal 'you' (Sie, always capitalised) used with strangers and in formal settings, and informal du/ihr for friends and family. The verb form changes with each pronoun.", "ml": "ജർമ്മനിൽ 'നീ/നിങ്ങൾ' എന്നതിന് രണ്ട് രൂപമുണ്ട്: ഔപചാരികമായ Sie (എപ്പോഴും വലിയ അക്ഷരത്തിൽ, അപരിചിതർക്കും മുതിർന്നവർക്കും) ഒപ്പം സൗഹൃദപരമായ du/ihr (സുഹൃത്തുക്കൾക്കും കുടുംബത്തിനും). ഓരോ pronoun-നും ക്രിയാരൂപം മാറും.", "blocks": [{"t": "table", "headers": ["Pronoun", "English", "മലയാളം"], "rows": [["ich", "I", "ഞാൻ"], ["du", "you (informal, one person)", "നീ"], ["er / sie / es", "he / she / it", "അവൻ / അവൾ / അത്"], ["wir", "we", "ഞങ്ങൾ / നാം"], ["ihr", "you (informal, group)", "നിങ്ങൾ"], ["sie / Sie", "they / you (formal)", "അവർ / താങ്കൾ"]]}, {"t": "examples", "items": [["Ich bin aus Indien.", "I am from India."], ["Sie ist meine Schwester.", "She is my sister."], ["Woher kommen Sie?", "Where are you from? (formal)"]]}], "tip": {"en": "Sie (formal) always takes the same verb form as sie/they: Sie sprechen, sie sprechen.", "ml": "Sie (ഔപചാരികം) എപ്പോഴും sie (അവർ) പോലെ തന്നെ ക്രിയാരൂപം എടുക്കും: Sie sprechen."}}, {"id": "possessive", "group": "Basics", "level": "A1", "icon": "🔑", "title": "Possessive Pronouns: mein, dein…", "en": "Possessives agree with the gender/case of the thing owned: mein (my), dein (your), sein (his), ihr (her/their), unser (our), euer (your). Add -e for feminine and plural: meine Mutter, meine Kinder.", "ml": "ഉടമസ്ഥത കാണിക്കുന്നവ: mein (എന്റെ), dein (നിന്റെ), sein (അവന്റെ), ihr (അവളുടെ/അവരുടെ), unser (ഞങ്ങളുടെ), euer (നിങ്ങളുടെ). സ്ത്രീലിംഗത്തിനും ബഹുവചനത്തിനും -e ചേർക്കും: meine Mutter, meine Kinder.", "blocks": [{"t": "table", "headers": ["", "masculine", "feminine", "neuter", "plural"], "rows": [["my", "mein Bruder", "meine Schwester", "mein Kind", "meine Kinder"], ["your", "dein Bruder", "deine Schwester", "dein Kind", "deine Kinder"], ["his", "sein Bruder", "seine Schwester", "sein Kind", "seine Kinder"]]}, {"t": "examples", "items": [["Das ist mein Buch.", "That is my book."], ["Meine Mutter ist Ärztin.", "My mother is a doctor."], ["Ist das dein Auto?", "Is that your car?"]]}], "tip": {"en": "In accusative, only masculine adds -en: Ich sehe meinen Bruder. (not mein)", "ml": "Accusative-ൽ പുല്ലിംഗത്തിന് മാത്രം -en: Ich sehe meinen Bruder."}}, {"id": "present", "group": "Verbs", "level": "A1", "icon": "⚡", "title": "Present Tense (Präsens)", "en": "Regular verbs follow one pattern: stem + ending. Endings: ich -e, du -st, er/sie/es -t, wir -en, ihr -t, sie -en. Example with machen (to make/do):", "ml": "ക്രമമായ ക്രിയകൾ ഒരു പാറ്റേണിൽ പറ്റും: മൂലരൂപം + അവസാനം. അവസാനങ്ങൾ: ich -e, du -st, er/sie/es -t, wir -en, ihr -t, sie -en. ഉദാഹരണം machen (ചെയ്യുക):", "blocks": [{"t": "table", "headers": ["ich", "du", "er/sie/es", "wir", "ihr", "sie"], "rows": [["mache", "machst", "macht", "machen", "macht", "machen"], ["lerne", "lernst", "lernt", "lernen", "lernt", "lernen"], ["wohne", "wohnst", "wohnt", "wohnen", "wohnt", "wohnen"]]}, {"t": "examples", "items": [["Ich lerne Deutsch.", "I learn German / I am learning German."], ["Wir wohnen in Berlin.", "We live in Berlin."], ["Was machst du?", "What are you doing?"]]}, {"t": "note", "en": "German present tense also covers English -ing forms: Ich lerne = I learn / I am learning / I do learn.", "ml": "ജർമ്മൻ present tense തന്നെ English -ing രൂപങ്ങളെയും കവർ ചെയ്യും: Ich lerne = ഞാൻ പഠിക്കുന്നു."}], "tip": {"en": "For stems ending in -t/-d (arbeiten, finden) insert -e: du arbeitest, er arbeitet.", "ml": "മൂലരൂപം -t/-d-ൽ അവസാനിച്ചാൽ -e കൂട്ടിച്ചേർക്കുക: du arbeitest, er arbeitet."}}, {"id": "seinhaben", "group": "Verbs", "level": "A1", "icon": "🔋", "title": "The Big Three: sein, haben, werden", "en": "These three irregular verbs are used constantly — including to form past and future tenses. Learn them by heart first!", "ml": "ഈ മൂന്ന് അനിയത ക്രിയകളും എപ്പോഴും ഉപയോഗിക്കും — ഭൂതകാലവും ഭാവികാലവും ഉണ്ടാക്കാനും. ഇവ ആദ്യം മനഃപാഠമാക്കുക!", "blocks": [{"t": "table", "headers": ["", "sein (ആയിരിക്കുക)", "haben (ഉണ്ടായിരിക്കുക)", "werden (ആകുക)"], "rows": [["ich", "bin", "habe", "werde"], ["du", "bist", "hast", "wirst"], ["er/sie/es", "ist", "hat", "wird"], ["wir", "sind", "haben", "werden"], ["ihr", "seid", "habt", "werdet"], ["sie/Sie", "sind", "haben", "werden"]]}, {"t": "examples", "items": [["Ich bin müde.", "I am tired."], ["Hast du Hunger?", "Are you hungry? (Have you hunger?)"], ["Er wird Arzt.", "He is becoming a doctor."]]}], "tip": {"en": "Ich bin = ഞാൻ ആണ്; ich habe = എനിക്കുണ്ട്; ich werde = ഞാൻ ആകുന്നു.", "ml": "Ich bin = ഞാൻ ആണ്; ich habe = എനിക്കുണ്ട്; ich werde = ഞാൻ ആകുന്നു."}}, {"id": "stemchange", "group": "Verbs", "level": "A1", "icon": "🔀", "title": "Irregular Verbs & Stem Changes", "en": "Many common verbs change their stem vowel in du and er/sie/es forms only. Learn these as patterns.", "ml": "പല സാധാരണ ക്രിയകളിലും du, er/sie/es രൂപങ്ങളിൽ മാത്രം മൂലസ്വരം മാറും. ഇവ പാറ്റേണുകളായി പഠിക്കുക.", "blocks": [{"t": "table", "headers": ["Pattern", "Verb", "du", "er/sie/es", "മലയാളം"], "rows": [["e → i", "geben", "gibst", "gibt", "കൊടുക്കുക"], ["e → i", "essen", "isst", "isst", "കഴിക്കുക"], ["e → i", "sprechen", "sprichst", "spricht", "സംസാരിക്കുക"], ["e → ie", "sehen", "siehst", "sieht", "കാണുക"], ["e → ie", "lesen", "liest", "liest", "വായിക്കുക"], ["a → ä", "fahren", "fährst", "fährt", "ഓടിക്കുക"], ["a → ä", "schlafen", "schläfst", "schläft", "ഉറങ്ങുക"]]}, {"t": "examples", "items": [["Er spricht gut Deutsch.", "He speaks German well."], ["Sie schläft jetzt.", "She is sleeping now."], ["Was liest du?", "What are you reading?"]]}], "tip": {"en": "wir and ihr NEVER change the stem: wir geben, ihr gebt.", "ml": "wir, ihr രൂപങ്ങളിൽ ഒരിക്കലും മാറ്റമുണ്ടാകില്ല: wir geben, ihr gebt."}}, {"id": "modal", "group": "Verbs", "level": "A2", "icon": "🎛️", "title": "Modal Verbs: können, müssen…", "en": "Modals express ability, necessity, permission, desire. They take a second verb as infinitive at the END of the sentence.", "ml": "Modal ക്രിയകൾ കഴിവ്, നിർബന്ധം, അനുവാദം, ആഗ്രഹം എന്നിവ കാണിക്കുന്നു. ഇവയോടൊപ്പം മറ്റൊരു ക്രിയയുടെ infinitive വാക്യത്തിന്റെ അവസാനത്തിൽ വരും.", "blocks": [{"t": "table", "headers": ["Modal", "Meaning", "മലയാളം", "ich", "du", "er"], "rows": [["können", "can / to be able to", "കഴിയുക", "kann", "kannst", "kann"], ["müssen", "must / have to", "വേണം (നിർബന്ധം)", "muss", "musst", "muss"], ["dürfen", "may / be allowed", "അനുവാദമുണ്ട്", "darf", "darfst", "darf"], ["sollen", "should / supposed to", "വേണം (ഉപദേശം)", "soll", "sollst", "soll"], ["wollen", "to want", "ആഗ്രഹിക്കുക", "will", "willst", "will"], ["mögen", "to like", "ഇഷ്ടപ്പെടുക", "mag", "magst", "mag"]]}, {"t": "examples", "items": [["Ich kann Deutsch sprechen.", "I can speak German."], ["Du musst lernen.", "You must study."], ["Darf ich fragen?", "May I ask?"], ["Wir wollen nach Berlin fahren.", "We want to travel to Berlin."]]}, {"t": "note", "en": "müssen = strong necessity; sollen = recommendation. \"Du musst nicht\" = you don't have to (no obligation); \"Du darfst nicht\" = you are not allowed.", "ml": "müssen = ശക്തമായ നിർബന്ധം; sollen = ഉപദേശം. 'Du musst nicht' = നിർബന്ധമില്ല; 'Du darfst nicht' = അനുവാദമില്ല."}], "tip": {"en": "Modal + infinitive at the end: Ich kann gut schwimmen. (can + swim)", "ml": "Modal + infinitive അവസാനം: Ich kann gut schwimmen."}}, {"id": "perfekt", "group": "Verbs", "level": "A2", "icon": "⏪", "title": "Perfect Tense (Perfekt) — spoken past", "en": "The Perfekt is the normal past tense in spoken German: haben/sein (conjugated) + Partizip II at the end. Regular: ge- + stem + -t (machen → gemacht). Irregular: ge- + stem + -en (gehen → gegangen).", "ml": "സംസാരഭാഷയിലെ സാധാരണ ഭൂതകാലമാണ് Perfekt: haben/sein (രൂപം മാറ്റി) + Partizip II അവസാനം. ക്രമമായത്: ge- + മൂലം + -t (machen → gemacht). അനിയതം: ge- + മൂലം + -en (gehen → gegangen).", "blocks": [{"t": "table", "headers": ["Type", "Verb", "Partizip II", "Example"], "rows": [["regular", "machen", "gemacht", "Ich habe das gemacht."], ["regular", "lernen", "gelernt", "Wir haben Deutsch gelernt."], ["irregular", "gehen", "gegangen", "Er ist nach Hause gegangen."], ["irregular", "essen", "gegessen", "Ich habe Pizza gegessen."], ["irregular", "sehen", "gesehen", "Hast du den Film gesehen?"], ["separable", "aufstehen", "aufgestanden", "Ich bin um 7 Uhr aufgestanden."]]}, {"t": "note", "en": "Verbs of movement or change of state use sein: gehen, kommen, fahren, fliegen, laufen, aufstehen. Everything else uses haben.", "ml": "ചലനത്തിന്റെയോ അവസ്ഥാമാറ്റത്തിന്റെയോ ക്രിയകൾ sein ഉപയോഗിക്കും: gehen, kommen, fahren, fliegen, laufen, aufstehen. ബാക്കിയെല്ലാം haben."}, {"t": "examples", "items": [["Ich habe gestern Pizza gegessen.", "I ate pizza yesterday."], ["Sie ist nach Berlin geflogen.", "She flew to Berlin."]]}], "tip": {"en": "The auxiliary goes in position 2, the Partizip II goes to the very end: Ich habe gestern Pizza gegessen.", "ml": "haben/sein രണ്ടാം സ്ഥാനത്ത്, Partizip II അങ്ങേയറ്റം അവസാനം: Ich habe gestern Pizza gegessen."}}, {"id": "preterit", "group": "Verbs", "level": "B1", "icon": "📜", "title": "Simple Past (Präteritum) & Past Perfect", "en": "Präteritum is used mostly in writing and with sein/haben/modal verbs in speech: war, hatte, konnte. Regular verbs add -te: machte, lernte. Irregular: ging, kam, sah, aß, trank. Plusquamperfekt = hatte/war + Partizip II (past before the past).", "ml": "Präteritum പ്രധാനമായും എഴുത്തിലും, sein/haben/modal ക്രിയകൾക്കൊപ്പം സംസാരത്തിലും ഉപയോഗിക്കും: war, hatte, konnte. ക്രമമായവ -te ചേർക്കും: machte. അനിയതം: ging, kam, sah. Plusquamperfekt = hatte/war + Partizip II (ഭൂതത്തിനും മുമ്പുള്ള ഭൂതം).", "blocks": [{"t": "table", "headers": ["Verb", "Präteritum (er)", "Perfekt (er hat/ist…)"], "rows": [["sein", "war", "ist gewesen"], ["haben", "hatte", "hat gehabt"], ["gehen", "ging", "ist gegangen"], ["kommen", "kam", "ist gekommen"], ["sehen", "sah", "hat gesehen"], ["essen", "aß", "hat gegessen"], ["machen", "machte", "hat gemacht"]]}, {"t": "examples", "items": [["Es war ein schöner Tag.", "It was a beautiful day."], ["Nachdem ich gegessen hatte, ging ich schlafen.", "After I had eaten, I went to sleep."]]}], "tip": {"en": "For A1–A2 speaking, you mainly need: war/warst/waren (was/were) and hatte (had).", "ml": "A1–A2 സംസാരത്തിന് പ്രധാനമായും വേണ്ടത്: war, hatte എന്നിവയാണ്."}}, {"id": "future", "group": "Verbs", "level": "A2", "icon": "🔮", "title": "Future: werden + Infinitiv", "en": "Future = conjugated werden + infinitive at the end. But Germans often just use the present tense with a time word for the future.", "ml": "ഭാവികാലം = werden (രൂപം മാറ്റി) + infinitive അവസാനം. പക്ഷേ ജർമ്മൻകാർ പലപ്പോഴും സമയം കൂടെ പറഞ്ഞ് present tense തന്നെ ഉപയോഗിക്കും.", "blocks": [{"t": "examples", "items": [["Ich werde morgen nach Berlin fliegen.", "I will fly to Berlin tomorrow."], ["Wir werden ein Haus kaufen.", "We will buy a house."], ["Morgen fliege ich nach Berlin.", "I'm flying to Berlin tomorrow. (present = future)"], ["Es wird regnen.", "It will rain."]]}], "tip": {"en": "werden + adjective = becoming: Ich werde müde. (I'm getting tired)", "ml": "werden + നാമവിശേഷണം = ആകുക: Ich werde müde. (എനിക്ക് ക്ഷീണം വരുന്നു)"}}, {"id": "separable", "group": "Verbs", "level": "A2", "icon": "🧩", "title": "Separable Verbs", "en": "Verbs like aufstehen (get up), anfangen (start), einkaufen (shop) split in the present: the prefix jumps to the END of the sentence. In Perfekt they stay together: aufgestanden.", "ml": "aufstehen (എഴുന്നേൽക്കുക), anfangen (തുടങ്ങുക), einkaufen (ഷോപ്പിംഗ്) പോലുള്ള ക്രിയകൾ present-ൽ പിരിയും: prefix വാക്യത്തിന്റെ അവസാനത്തിലേക്ക് പോകും. Perfekt-ൽ കൂട്ടിച്ചേർന്ന്: aufgestanden.", "blocks": [{"t": "examples", "items": [["Ich stehe um 7 Uhr auf.", "I get up at 7 o'clock."], ["Der Kurs fängt um 9 Uhr an.", "The course starts at 9."], ["Wir kaufen im Supermarkt ein.", "We do shopping at the supermarket."], ["Er ist früh aufgestanden.", "He got up early. (Perfekt, together)"]]}, {"t": "note", "en": "Inseparable prefixes (be-, ge-, er-, ver-, zer-, ent-, miss-) NEVER split: Ich verstehe dich. → Ich habe dich verstanden.", "ml": "be-, ge-, er-, ver-, zer-, ent-, miss- പോലുള്ള prefix-കൾ ഒരിക്കലും പിരിയില്ല: Ich verstehe dich."}], "tip": {"en": "The prefix usually carries the meaning: an-fangen (to start), auf-hören (to stop), mit-kommen (to come along).", "ml": "prefix ആണ് അർത്ഥം തീരുമാനിക്കുന്നത്: anfangen (തുടങ്ങുക), aufhören (നിർത്തുക), mitkommen (കൂടെ വരിക)."}}, {"id": "wordorder", "group": "Sentences", "level": "A1", "icon": "🧱", "title": "Word Order: The Verb in Position 2", "en": "In main clauses the conjugated verb is ALWAYS the second element. Time → Manner → Place (time, how, where). If you start with a time word, the verb stays in position 2 and the subject moves after it.", "ml": "പ്രധാന വാക്യങ്ങളിൽ ക്രിയ എപ്പോഴും രണ്ടാം സ്ഥാനത്തായിരിക്കും. ക്രമം: സമയം → രീതി → സ്ഥലം. സമയം കൊണ്ട് തുടങ്ങിയാലും ക്രിയ രണ്ടാം സ്ഥാനത്ത് തന്നെ, വിഷയം (subject) ക്രിയയ്ക്ക് ശേഷം.", "blocks": [{"t": "table", "headers": ["Position 1", "Position 2 (verb)", "…", "End"], "rows": [["Ich", "lerne", "Deutsch.", ""], ["Heute", "lerne", "ich", "Deutsch."], ["Wir", "fahren", "morgen mit dem Bus", "nach Berlin."], ["Ich", "habe", "gestern Pizza", "gegessen."]]}, {"t": "examples", "items": [["Ich lerne Deutsch.", "I am learning German."], ["Morgen gehe ich einkaufen.", "Tomorrow I'm going shopping."], ["Er fährt heute mit dem Auto nach München.", "He drives to Munich by car today."]]}, {"t": "note", "en": "Malayalam puts the verb at the end (SOV); German puts it in position 2 (V2). Don't copy Malayalam word order into German!", "ml": "മലയാളത്തിൽ ക്രിയ അവസാനം (SOV); ജർമ്മനിൽ രണ്ടാം സ്ഥാനത്ത് (V2). മലയാളം വാക്യക്രമം ജർമ്മനിലേക്ക് പകർത്തരുത്!"}], "tip": {"en": "Time beats place: Zeit (wann?) → Art (wie?) → Ort (wo?).", "ml": "ക്രമം ഓർക്കുക: എപ്പോൾ → എങ്ങനെ → എവിടെ."}}, {"id": "negation", "group": "Sentences", "level": "A1", "icon": "🚫", "title": "Negation: nicht vs. kein", "en": "kein negates nouns (no / not a); nicht negates verbs, adjectives, adverbs. Position of nicht: before the word it negates, or at the end for the whole sentence.", "ml": "kein നാമങ്ങളെ നിഷേധിക്കും (ഒരു…ഇല്ല); nicht ക്രിയകളെയും വിശേഷണങ്ങളെയും നിഷേധിക്കും. nicht-ന്റെ സ്ഥാനം: നിഷേധിക്കുന്ന വാക്കിന് മുന്നിൽ, അല്ലെങ്കിൽ മുഴുവൻ വാക്യത്തെ നിഷേധിക്കുമ്പോൾ അവസാനം.", "blocks": [{"t": "examples", "items": [["Ich habe kein Auto.", "I have no car. (noun)"], ["Ich habe keine Zeit.", "I have no time."], ["Ich bin nicht müde.", "I am not tired. (adjective)"], ["Ich schlafe nicht.", "I don't sleep. (verb, end)"], ["Das ist nicht mein Buch.", "That is not my book."]]}], "tip": {"en": "If there's an ein/kein-article or no article → kein. Otherwise → nicht.", "ml": "ein/kein ആർട്ടിക്കിൾ ഉണ്ടെങ്കിൽ അല്ലെങ്കിൽ ആർട്ടിക്കിൾ ഇല്ലെങ്കിൽ → kein; അല്ലാത്തപ്പോൾ → nicht."}}, {"id": "questions", "group": "Sentences", "level": "A1", "icon": "❓", "title": "Questions: W-Words & Yes/No", "en": "W-questions start with a question word (wer, was, wo, wann, warum, wie…) followed by the verb. Yes/no questions start with the verb. Answer yes/no questions with ja, nein — or doch when the question is negative and your answer is positive.", "ml": "W-ചോദ്യങ്ങൾ ചോദ്യപദത്തിൽ (wer, was, wo, wann, warum, wie…) തുടങ്ങി പിന്നെ ക്രിയ. അതെ/ഇല്ല ചോദ്യങ്ങൾ ക്രിയയിൽ തുടങ്ങും. നിഷേധാത്മക ചോദ്യത്തിന് 'അതെ' എന്ന് പറയുമ്പോൾ ja ഒഴിവാക്കി doch ഉപയോഗിക്കുക.", "blocks": [{"t": "table", "headers": ["Question", "English", "മലയാളം"], "rows": [["Wer bist du?", "Who are you?", "നീ ആരാണ്?"], ["Was machst du?", "What are you doing?", "നീ എന്ത് ചെയ്യുന്നു?"], ["Wo wohnst du?", "Where do you live?", "നീ എവിടെ താമസിക്കുന്നു?"], ["Wann kommst du?", "When are you coming?", "നീ എപ്പോൾ വരും?"], ["Warum lernst du Deutsch?", "Why are you learning German?", "നീ എന്തുകൊണ്ട് ജർമ്മൻ പഠിക്കുന്നു?"], ["Wie geht es dir?", "How are you?", "നിനക്ക് സുഖമാണോ?"], ["Kommst du mit?", "Are you coming along?", "നീ കൂടെ വരുമോ?"]]}, {"t": "note", "en": "Hast du kein Geld? – Doch! (= Yes, I do have money!)", "ml": "Hast du kein Geld? – Doch! (= ഉണ്ട്, എനിക്ക് പണമുണ്ട്!)"}], "tip": {"en": "wo = where; wohin = where to (direction); woher = where from (origin).", "ml": "wo = എവിടെ; wohin = എങ്ങോട്ട് (ദിശ); woher = എവിടെനിന്ന് (ഉത്ഭവം)."}}, {"id": "prepositions", "group": "Sentences", "level": "A2", "icon": "📍", "title": "Prepositions & Their Cases", "en": "Some prepositions always take accusative, some always dative, and the two-way prepositions (in, an, auf…) take dative for location (wo?) and accusative for direction (wohin?).", "ml": "ചില prepositions എപ്പോഴും accusative എടുക്കും, ചിലത് എപ്പോഴും dative. രണ്ട് വഴിയുള്ളവ (in, an, auf…) സ്ഥലം കാണിക്കുമ്പോൾ (എവിടെ?) dative, ദിശ കാണിക്കുമ്പോൾ (എങ്ങോട്ട്?) accusative.", "blocks": [{"t": "table", "headers": ["Case", "Prepositions", "Examples"], "rows": [["Accusative only", "durch, für, gegen, ohne, um", "für dich (നിനക്ക് വേണ്ടി), ohne dich (നീ കൂടാതെ)"], ["Dative only", "aus, bei, mit, nach, seit, von, zu", "mit mir (എന്നോടൊപ്പം), nach Hause (വീട്ടിലേക്ക്)"], ["Two-way (Dat=wo? / Akk=wohin?)", "in, an, auf, über, unter, neben, zwischen, vor, hinter", "in der Küche (അടുക്കളയിൽ) / in die Küche (അടുക്കളയിലേക്ക്)"]]}, {"t": "examples", "items": [["Das Buch liegt auf dem Tisch.", "The book lies on the table. (location → dative)"], ["Ich lege das Buch auf den Tisch.", "I put the book on the table. (direction → accusative)"], ["Wir fahren nach Deutschland.", "We drive to Germany. (nach + city/country)"]]}, {"t": "note", "en": "Common contractions: in + dem = im, an + dem = am, zu + dem = zum, zu + der = zur, in + das = ins, bei + dem = beim, von + dem = vom.", "ml": "സാധാരണ ചുരുക്കങ്ങൾ: im, am, zum, zur, ins, beim, vom."}], "tip": {"en": "WO? (location, resting) = dative. WOHIN? (motion, destination) = accusative.", "ml": "എവിടെ? (സ്ഥിതി) = dative. എങ്ങോട്ട്? (ചലനം) = accusative."}}, {"id": "subclauses", "group": "Sentences", "level": "B1", "icon": "🪆", "title": "Subordinate Clauses: dass, weil, wenn…", "en": "Subordinate clauses start with a conjunction (dass, weil, wenn, obwohl, ob, als) and the conjugated verb goes to the END. The clause is separated by a comma. If the subordinate clause comes first, the main verb still takes position 2.", "ml": "ഉപവാക്യങ്ങൾ conjunctions (dass, weil, wenn, obwohl, ob, als) കൊണ്ട് തുടങ്ങും, ക്രിയ അവസാനത്തിലേക്ക് പോകും. ഉപവാക്യത്തിന് മുന്നിൽ കോമ ഇടണം. ഉപവാക്യം ആദ്യം വന്നാൽ പ്രധാന ക്രിയ രണ്ടാം സ്ഥാനത്ത് തന്നെ.", "blocks": [{"t": "table", "headers": ["Conjunction", "Meaning", "മലയാളം"], "rows": [["dass", "that", "എന്ന്"], ["weil", "because", "കാരണം"], ["wenn", "if / when (repeated)", "എങ്കിൽ / എപ്പോഴെല്ലാം"], ["als", "when (once, past)", "എപ്പോൾ (ഭൂതകാലം, ഒറ്റത്തവണ)"], ["obwohl", "although", "എങ്കിലും"], ["ob", "whether", "എന്നോ"]]}, {"t": "examples", "items": [["Ich weiß, dass er kommt.", "I know that he is coming. (…dass er kommt.)"], ["Ich lerne Deutsch, weil ich in Deutschland arbeiten will.", "I learn German because I want to work in Germany."], ["Wenn es regnet, bleibe ich zu Hause.", "If it rains, I stay at home."], ["Als ich klein war, wohnte ich in Kerala.", "When I was little, I lived in Kerala."]]}], "tip": {"en": "weil (because) sends the verb to the end; denn (because) does NOT: Ich bin müde, denn ich habe gearbeitet.", "ml": "weil ക്രിയയെ അവസാനത്തിലേക്ക് അയക്കും; denn അയക്കില്ല: Ich bin müde, denn ich habe gearbeitet."}}, {"id": "imperative", "group": "Sentences", "level": "A2", "icon": "📣", "title": "Imperative (Commands)", "en": "Commands: du-form loses -st (komm!, mach!), often without -e (but with -e after -t/-d: arbeite!). ihr-form = normal verb form (kommt!). Sie/wir-form = verb first (Kommen Sie!, Gehen wir!).", "ml": "കൽപനകൾ: du രൂപത്തിൽ നിന്ന് -st നീക്കുക (komm!, mach!). ihr രൂപം = സാധാരണ രൂപം (kommt!). Sie/wir രൂപം = ക്രിയ ആദ്യം (Kommen Sie!, Gehen wir!).", "blocks": [{"t": "table", "headers": ["Person", "Example", "English", "മലയാളം"], "rows": [["du", "Komm her!", "Come here!", "ഇങ്ങോട്ട് വാ!"], ["ihr", "Kommt her!", "Come here! (you all)", "നിങ്ങൾ ഇങ്ങോട്ട് വരൂ!"], ["Sie", "Kommen Sie bitte!", "Please come! (formal)", "ദയവായി വരൂ!"], ["wir", "Gehen wir!", "Let's go!", "നമുക്ക് പോകാം!"], ["special", "Sei ruhig!", "Be quiet!", "ശാന്തമായിരിക്കൂ!"]]}], "tip": {"en": "Verbs with a→ä keep the umlaut in commands: schlafen → Schlaf gut! (not schläf).", "ml": "a→ä മാറുന്ന ക്രിയകളിൽ command-ൽ ഉംലോട്ട് മാറ്റരുത്: Schlaf gut! (നല്ല ഉറക്കം!)"}}, {"id": "adjectives", "group": "Sentences", "level": "A2", "icon": "🎨", "title": "Adjective Endings", "en": "Before a noun, adjectives take endings depending on the article type. After der-words: der große Mann (add -e). After ein-words: ein großer Mann (add -er, because ein has no ending). No article: großer Mann.", "ml": "നാമത്തിന് മുന്നിലെ വിശേഷണങ്ങൾക്ക് ആർട്ടിക്കിളിനനുസരിച്ച് അവസാനം കിട്ടും. der-ശേഷം: der große Mann (-e). ein-ശേഷം: ein großer Mann (-er). ആർട്ടിക്കിൾ ഇല്ലെങ്കിൽ: großer Mann.", "blocks": [{"t": "table", "headers": ["Article type", "masculine", "feminine", "neuter", "plural"], "rows": [["der-word", "der große Mann", "die schöne Frau", "das kleine Kind", "die großen Kinder"], ["ein-word", "ein großer Mann", "eine schöne Frau", "ein kleines Kind", "keine großen Kinder"], ["no article", "großer Mann", "schöne Frau", "kleines Kind", "große Kinder"]]}, {"t": "examples", "items": [["Das ist ein interessantes Buch.", "That is an interesting book."], ["Ich habe einen neuen Computer.", "I have a new computer. (accusative, ein → einen + -en)"], ["Berlin ist eine schöne Stadt.", "Berlin is a beautiful city."]]}], "tip": {"en": "After ein/eine (which already shows the gender), the adjective takes the strong ending: ein + -er/-es. Practice with: ein guter Freund, eine gute Idee, ein gutes Buch.", "ml": "ein ശേഷം വിശേഷണത്തിന് ശക്തമായ അവസാനം: ein guter Freund, eine gute Idee, ein gutes Buch."}}, {"id": "comparison", "group": "Sentences", "level": "A2", "icon": "📊", "title": "Comparison: bigger, best…", "en": "Comparative = -er, superlative = am …-sten: schnell → schneller → am schnellsten. Irregular: gut → besser → am besten; gern → lieber → am liebsten; viel → mehr → am meisten. \"than\" = als.", "ml": "താരതമ്യം: -er, അത്യുത്തമം: am …-sten: schnell → schneller → am schnellsten. അനിയതം: gut → besser → am besten; gern → lieber; viel → mehr. 'എന്നതിനെക്കാൾ' = als.", "blocks": [{"t": "table", "headers": ["Positive", "Comparative", "Superlative", "മലയാളം"], "rows": [["schnell", "schneller", "am schnellsten", "വേഗം → കൂടുതൽ വേഗം → ഏറ്റവും വേഗം"], ["groß", "größer", "am größten", "വലിയ → വലുത് → ഏറ്റവും വലുത്"], ["gut", "besser", "am besten", "നല്ലത് → മെച്ചപ്പെട്ടത് → ഏറ്റവും നല്ലത്"], ["viel", "mehr", "am meisten", "കൂടുതൽ → ഏറ്റവും കൂടുതൽ"]]}, {"t": "examples", "items": [["Mein Bruder ist größer als ich.", "My brother is taller than me."], ["Deutsch wird immer interessanter.", "German is getting more and more interesting."], ["Ich esse am liebsten Pizza.", "I like pizza best of all."]]}], "tip": {"en": "als = than (comparison). wenn/als = when. Don't mix them!", "ml": "als = 'എന്നതിനെക്കാൾ' (താരതമ്യം). 'എപ്പോൾ' എന്നതിന് wenn/als. ഇവ കൂട്ടിക്കുഴയ്ക്കരുത്!"}}, {"id": "numbers", "group": "Sentences", "level": "A1", "icon": "🔢", "title": "Numbers, Dates & Telling Time", "en": "Numbers 21+ are said \"ones-then-tens\": 21 = einundzwanzig (one-and-twenty). Telling time: 8:30 = halb neun (half TO nine — careful, the opposite of English!). 8:15 = Viertel nach acht; 8:45 = Viertel vor neun.", "ml": "21 മുതൽ 'ഒന്ന്-ഉം-ഇരുപത്' എന്ന് പറയും: 21 = einundzwanzig. സമയം: 8:30 = halb neun (ഇംഗ്ലീഷിന്റെ നേർ വിപരീതം — 'ഒമ്പതിന് പകുതി'!). 8:15 = Viertel nach acht; 8:45 = Viertel vor neun.", "blocks": [{"t": "table", "headers": ["German", "Meaning", "മലയാളം"], "rows": [["einundzwanzig (21)", "one-and-twenty", "ഇരുപത്തിയൊന്ന്"], ["dreiunddreißig (33)", "three-and-thirty", "മുപ്പത്തിമൂന്ന്"], ["Es ist 8 Uhr.", "It is 8 o'clock.", "മണി എട്ട്."], ["Es ist halb neun.", "It is 8:30 (half to nine).", "മണി എട്ടര."], ["Es ist Viertel nach acht.", "It is 8:15.", "മണി എട്ടേ കാൽ."], ["Es ist Viertel vor neun.", "It is 8:45.", "മണി ഒമ്പതിന് കാൽ മുമ്പ്."], ["der erste Mai", "May 1st (the first of May)", "മെയ് ഒന്ന്"]]}, {"t": "examples", "items": [["Ich habe am 5. (fünften) Juli Geburtstag.", "My birthday is on July 5th."], ["Um wie viel Uhr beginnt der Kurs?", "At what time does the course start?"], ["Wir treffen uns um 14 Uhr.", "We meet at 2 p.m. (14:00, 24-hour clock)."]]}], "tip": {"en": "Germans use the 24-hour clock in official times: 14 Uhr = 2 p.m.", "ml": "ഔപചാരിക സമയങ്ങളിൽ 24 മണിക്കൂർ രീതി: 14 Uhr = ഉച്ചയ്ക്ക് 2."}}, {"id": "punct-period", "group": "Punctuation", "level": "A1", "icon": "🟤", "title": "The Period & Capital Letters", "en": "A period (der Punkt) ends a statement sentence. German capitalises ALL nouns (das Haus, die Liebe), the formal Sie, and adjectives derived from names. This makes German text easier to read — nouns are always visible!", "ml": "പ്രസ്താവനാ വാക്യം അവസാനിപ്പിക്കാൻ പീരിയഡ് (der Punkt). ജർമ്മനിൽ എല്ലാ നാമങ്ങളും (das Haus, die Liebe), ഔപചാരിക Sie, പേരിൽ നിന്നുള്ള വിശേഷണങ്ങളും വലിയ അക്ഷരത്തിൽ എഴുതണം. ഇത് വായന എളുപ്പമാക്കും — നാമങ്ങൾ എപ്പോഴും കാണാം!", "blocks": [{"t": "examples", "items": [["Ich lerne Deutsch.", "I am learning German."], ["Das Wetter ist schön.", "The weather is beautiful."], ["Ich trinke Kaffee und Tee.", "I drink coffee and tea. (nouns: Kaffee, Tee)"]]}], "tip": {"en": "If a noun is inside the sentence, it is STILL capitalised: Ich habe einen Bruder und eine Schwester.", "ml": "വാക്യത്തിന്റെ നടുവിലുള്ള നാമങ്ങളും വലിയ അക്ഷരത്തിൽ തന്നെ: Ich habe einen Bruder und eine Schwester."}}, {"id": "punct-comma", "group": "Punctuation", "level": "A2", "icon": "✂️", "title": "The Comma (das Komma)", "en": "Comma rules: 1) between items in a list, 2) before aber/sondern/denn, 3) between main and subordinate clauses (weil, dass, wenn…), 4) after greetings in letters (Liebe Anna, …). No comma before und/oder in short lists.", "ml": "കോമ നിയമങ്ങൾ: 1) ലിസ്റ്റിലെ ഇനങ്ങൾക്കിടയിൽ, 2) aber/sondern/denn-ന് മുന്നിൽ, 3) പ്രധാന വാക്യവും ഉപവാക്യവും തമ്മിൽ (weil, dass, wenn…), 4) കത്തുകളിലെ അഭിവാദനത്തിന് ശേഷം (Liebe Anna, …). ചെറിയ ലിസ്റ്റുകളിൽ und/oder-ന് മുന്നിൽ കോമ വേണ്ട.", "blocks": [{"t": "examples", "items": [["Ich kaufe Brot, Käse und Milch.", "I buy bread, cheese and milk. (list)"], ["Ich bin müde, aber ich lerne weiter.", "I am tired, but I keep studying."], ["Ich weiß, dass du Recht hast.", "I know that you are right. (subordinate clause)"], ["Liebe Mutter, ich hoffe, es geht dir gut.", "Dear mother, I hope you are well. (letter)"]]}], "tip": {"en": "Comma before weil/dass/wenn is NOT optional — it's required.", "ml": "weil/dass/wenn-ന് മുന്നിലെ കോമ നിർബന്ധമാണ് — ഒഴിവാക്കാനാവില്ല."}}, {"id": "punct-question", "group": "Punctuation", "level": "A1", "icon": "❕", "title": "Question Mark & Exclamation Mark", "en": "Question marks end questions (obviously!), exclamation marks end commands, greetings and exclamations. German greetings and commands almost always take an exclamation mark.", "ml": "ചോദ്യങ്ങൾക്ക് ചോദ്യചിഹ്നം, കൽപനകൾക്കും അഭിവാദനങ്ങൾക്കും ആശ്ചര്യചിഹ്നം. ജർമ്മൻ അഭിവാദനങ്ങളും കൽപനകളും മിക്കവാറും എപ്പോഴും ആശ്ചര്യചിഹ്നത്തോടെ.", "blocks": [{"t": "examples", "items": [["Woher kommst du?", "Where do you come from?"], ["Komm her!", "Come here!"], ["Guten Morgen!", "Good morning!"], ["Was für ein schöner Tag!", "What a beautiful day!"]]}], "tip": {"en": "In German, an exclamation mark after greetings is normal — not rude!", "ml": "അഭിവാദനങ്ങൾക്ക് ശേഷം ആശ്ചര്യചിഹ്നം ജർമ്മനിൽ സാധാരണമാണ് — മോശമല്ല!"}}, {"id": "punct-quotes", "group": "Punctuation", "level": "A2", "icon": "„“", "title": "German Quotation Marks & Colon", "en": "German uses „…“ (low opening, high closing) — not English \"…\". The colon (Doppelpunkt) introduces direct speech, lists and explanations. Direct speech after a colon often starts with a capital letter.", "ml": "ജർമ്മൻ ഉദ്ധരണി ചിഹ്നം „…“ ആണ് (താഴെ തുടങ്ങി മുകളിൽ അവസാനിക്കും) — ഇംഗ്ലീഷ് \"…\" അല്ല. കോളൻ (Doppelpunkt) നേരിട്ടുള്ള സംഭാഷണത്തിനും ലിസ്റ്റിനും വിശദീകരണത്തിനും മുന്നിൽ വരും.", "blocks": [{"t": "examples", "items": [["Er sagt: „Ich komme morgen.“", "He says: \"I am coming tomorrow.\""], ["Sie fragt: „Wo ist der Bahnhof?“", "She asks: \"Where is the station?\""], ["Ich brauche: Brot, Käse und Milch.", "I need: bread, cheese and milk."]]}], "tip": {"en": "Type „ with AltGr+Shift+W and “ with AltGr+Shift+2 on German keyboards.", "ml": "ജർമ്മൻ കീബോർഡിൽ „ = AltGr+Shift+W, “ = AltGr+Shift+2."}}, {"id": "punct-other", "group": "Punctuation", "level": "A2", "icon": "➖", "title": "Apostrophe, Hyphen, Semicolon", "en": "Apostrophe is rare in German — only for dropped letters (Wie geht's?, das ist 's) and names with s (Max' Buch). Hyphens join compounds and are optional for clarity. Semicolons join related clauses (stronger than comma, weaker than period).", "ml": "അപ്പോസ്ട്രോഫി ജർമ്മനിൽ വിരളമാണ് — അക്ഷരങ്ങൾ വിട്ടുപോയാൽ മാത്രം (Wie geht's?) ഒപ്പം s-ൽ അവസാനിക്കുന്ന പേരുകളിൽ (Max' Buch). ഹൈഫൻ സംയുക്ത പദങ്ങളെ കൂട്ടിച്ചേർക്കും. സെമികോളൺ ബന്ധപ്പെട്ട വാക്യങ്ങളെ യോജിപ്പിക്കും.", "blocks": [{"t": "examples", "items": [["Wie geht's?", "How's it going? (geht es → geht's)"], ["das ist 's", "that's it"], ["der 20-jährige Mann", "the 20-year-old man"], ["Ich lerne Deutsch; es macht Spaß.", "I learn German; it is fun."]]}], "tip": {"en": "Never use an apostrophe for plurals or possessives of regular nouns: die Autos (not die Auto's), Peters Auto (not Peter's).", "ml": "ബഹുവചനത്തിനോ സാധാരണ സ്വന്തത്തിനോ അപ്പോസ്ട്രോഫി വേണ്ട: die Autos, Peters Auto."}}, {"id": "plural", "group": "Basics", "level": "A1", "icon": "👥", "title": "Plurals of Nouns (der Plural)", "en": "German plurals are made in several ways. Learn the plural together with the noun (it is written after the dash, e.g. der Tisch, -e). Main patterns: add -e (der Tisch → die Tische), -er with umlaut (das Kind → die Kinder), -n/-en (die Frau → die Frauen), -s (das Auto → die Autos), or no change with umlaut (der Vater → die Väter).", "ml": "ജർമ്മൻ ബഹുവചനം പല വിധത്തിൽ ഉണ്ടാകും. നാമത്തോടൊപ്പം ബഹുവചനവും പഠിക്കുക (ഡാഷിന് ശേഷം എഴുതിയിരിക്കും, ഉദാ. der Tisch, -e). പ്രധാന രീതികൾ: -e ചേർക്കുക (der Tisch → die Tische), -er + ഉംലോട്ട് (das Kind → die Kinder), -n/-en (die Frau → die Frauen), -s (das Auto → die Autos), അല്ലെങ്കിൽ ഉംലോട്ട് മാത്രം (der Vater → die Väter).", "blocks": [{"t": "table", "headers": ["Pattern", "Example", "മലയാളം"], "rows": [["-e", "der Tisch → die Tische", "മേശ → മേശകൾ"], ["-¨e (umlaut + e)", "der Fuß → die Füße", "കാൽ → കാലുകൾ"], ["-er / -¨er", "das Kind → die Kinder", "കുട്ടി → കുട്ടികൾ"], ["-n / -en", "die Frau → die Frauen", "സ്ത്രീ → സ്ത്രീകൾ"], ["-s", "das Auto → die Autos", "കാർ → കാറുകൾ"], ["no change (-¨)", "der Vater → die Väter", "അച്ഛൻ → അച്ഛൻമാർ"], ["-¨e from -a/o/u", "der Apfel → die Äpfel", "ആപ്പിൾ → ആപ്പിളുകൾ"]]}, {"t": "examples", "items": [["Die Kinder spielen im Garten.", "The children are playing in the garden."], ["Ich habe zwei Brüder und drei Schwestern.", "I have two brothers and three sisters."], ["Die Autos sind neu.", "The cars are new."]]}, {"t": "note", "en": "Feminine nouns ending in -e almost always form the plural with -n: die Lampe → die Lampen.", "ml": "-e-ൽ അവസാനിക്കുന്ന സ്ത്രീലിംഗ നാമങ്ങൾ സാധാരണ -n ചേർത്ത് ബഹുവചനം ആക്കും: die Lampe → die Lampen."}], "tip": {"en": "In the vocabulary list of this tutor, the plural is always shown after the comma, e.g. „der Tisch, -e“.", "ml": "ഈ ട്യൂട്ടറുടെ പദാവലിയിൽ ബഹുവചനം എപ്പോഴും കോമയ്ക്ക് ശേഷം കാണാം: „der Tisch, -e“."}}, {"id": "esgibt", "group": "Basics", "level": "A1", "icon": "📍", "title": "es gibt & Time Prepositions (am, um, im)", "en": "\"es gibt\" = there is / there are. It always takes the accusative: Es gibt einen Supermarkt. For time: am + day part/day of week (am Montag), im + month/season (im Juli), um + clock time (um 8 Uhr), von…bis for ranges.", "ml": "es gibt = 'ഉണ്ട്' (എവിടെയെങ്കിലും എന്തെങ്കിലും). ഇത് എപ്പോഴും accusative എടുക്കും: Es gibt einen Supermarkt. സമയത്തിന്: am + ദിവസം (am Montag), im + മാസം/സീസൺ (im Juli), um + മണി (um 8 Uhr), von…bis ഇടവേളകൾക്ക്.", "blocks": [{"t": "table", "headers": ["Preposition", "Use", "Example", "മലയാളം"], "rows": [["am", "day parts + days", "am Montag, am Abend", "തിങ്കളാഴ്ച, വൈകുന്നേരം"], ["im", "months + seasons", "im Januar, im Sommer", "ജനുവരിയിൽ, വേനൽക്കാലത്ത്"], ["um", "clock times", "um 8 Uhr", "മണി 8-ന്"], ["von … bis", "time ranges", "von 9 bis 17 Uhr", "9 മുതൽ 5 വരെ"], ["in", "years + weeks", "im Jahr 2026, in einer Woche", "2026-ൽ, ഒരാഴ്ചയ്ക്കുള്ളിൽ"]]}, {"t": "examples", "items": [["Es gibt viele Museen in Berlin.", "There are many museums in Berlin."], ["Am Wochenende arbeite ich nicht.", "I don't work at the weekend."], ["Im Winter schneit es oft.", "It often snows in winter."], ["Der Kurs beginnt um 9 Uhr.", "The course starts at 9 o'clock."]]}, {"t": "note", "en": "am = an + dem; im = in + dem. Both are fixed contractions for time expressions.", "ml": "am = an + dem; im = in + dem. സമയ പ്രയോഗങ്ങളിൽ ഇവ ചുരുക്കിയ രൂപങ്ങളാണ്."}], "tip": {"en": "Wann? (when?) → am/im/um. Wo? (where?) → in/an/auf + dative.", "ml": "എപ്പോൾ? → am/im/um. എവിടെ? → in/an/auf + dative."}}, {"id": "reflexive", "group": "Verbs", "level": "A2", "icon": "🔄", "title": "Reflexive Verbs (sich)", "en": "Reflexive verbs use a reflexive pronoun (sich) that refers back to the subject: ich wasche mich (I wash myself). Reflexive pronouns: mich, dich, sich, uns, euch, sich. With body parts, German uses dative + accusative: Ich putze mir die Zähne.", "ml": "Reflexive ക്രിയകൾ കർത്താവിനെത്തന്നെ കുറിക്കുന്ന സർവ്വനാമം (sich) എടുക്കും: ich wasche mich (ഞാൻ സ്വയം കഴുകുന്നു). Reflexive സർവ്വനാമങ്ങൾ: mich, dich, sich, uns, euch, sich. ശരീരഭാഗങ്ങളുമായി dative + accusative: Ich putze mir die Zähne.", "blocks": [{"t": "table", "headers": ["Pronoun", "Reflexive (acc.)", "Example", "മലയാളം"], "rows": [["ich", "mich", "Ich freue mich.", "എനിക്ക് സന്തോഷമുണ്ട്."], ["du", "dich", "Du ärgerst dich.", "നീ ദേഷ്യപ്പെടുന്നു."], ["er/sie/es", "sich", "Er zieht sich an.", "അവൻ വസ്ത്രം ധരിക്കുന്നു."], ["wir", "uns", "Wir treffen uns.", "ഞങ്ങൾ കണ്ടുമുട്ടുന്നു."], ["ihr", "euch", "Ihr langweilt euch.", "നിങ്ങൾക്ക് ബോറടിക്കുന്നു."], ["sie/Sie", "sich", "Sie setzt sich.", "അവൾ ഇരിക്കുന്നു."]]}, {"t": "examples", "items": [["Ich wasche mich jeden Morgen.", "I wash myself every morning."], ["Er interessiert sich für Musik.", "He is interested in music."], ["Ich putze mir die Zähne.", "I brush my teeth. (dative mir + accusative die Zähne)"], ["Wir freuen uns auf die Ferien.", "We look forward to the holidays."]]}, {"t": "note", "en": "Common reflexive verbs: sich freuen (be glad), sich ärgern (get annoyed), sich anziehen (get dressed), sich interessieren für (be interested in), sich beeilen (hurry), sich erinnern an (remember).", "ml": "സാധാരണ reflexive ക്രിയകൾ: sich freuen, sich ärgern, sich anziehen, sich interessieren für, sich beeilen, sich erinnern an."}], "tip": {"en": "The reflexive pronoun agrees with the subject — not with the object!", "ml": "Reflexive സർവ്വനാമം കർത്താവിനോട് യോജിക്കണം — കർമ്മത്തോടല്ല!"}}, {"id": "zuinf", "group": "Verbs", "level": "A2", "icon": "🔗", "title": "zu + Infinitiv & um … zu", "en": "Many verbs are followed by zu + infinitive at the end: Ich habe keine Zeit zu lernen. With um … zu you express purpose (in order to): Ich lerne Deutsch, um in Deutschland zu arbeiten. After separable verbs, zu goes between prefix and stem: aufzustehen.", "ml": "പല ക്രിയകൾക്കും ശേഷം zu + infinitive അവസാനത്തിൽ വരും: Ich habe keine Zeit zu lernen. ഉദ്ദേശ്യം കാണിക്കാൻ um … zu: Ich lerne Deutsch, um in Deutschland zu arbeiten. പിരിയുന്ന ക്രിയകളിൽ zu prefix-നും മൂലത്തിനും ഇടയിൽ: aufzustehen.", "blocks": [{"t": "table", "headers": ["Pattern", "Example", "മലയാളം"], "rows": [["zu + Infinitiv", "Ich habe keine Zeit zu lernen.", "എനിക്ക് പഠിക്കാൻ സമയമില്ല."], ["es ist + adj + zu", "Es ist wichtig zu üben.", "പരിശീലിക്കേണ്ടത് പ്രധാനമാണ്."], ["um … zu", "Ich lerne Deutsch, um in Deutschland zu arbeiten.", "ജർമ്മനിയിൽ ജോലി ചെയ്യാൻ ഞാൻ ജർമ്മൻ പഠിക്കുന്നു."], ["ohne … zu", "Er geht weg, ohne etwas zu sagen.", "ഒന്നും പറയാതെ അവൻ പോകുന്നു."], ["separable: prefix+zu+stem", "Ich habe vergessen aufzustehen.", "എഴുന്നേൽക്കാൻ ഞാൻ മറന്നു."]]}, {"t": "examples", "items": [["Ich versuche, früh aufzustehen.", "I try to get up early."], ["Sie hat Angst zu fliegen.", "She is afraid of flying."], ["Er geht einkaufen, um Abendessen zu kochen.", "He goes shopping in order to cook dinner."]]}, {"t": "note", "en": "After modal verbs (können, müssen…) you use the bare infinitive WITHOUT zu: Ich kann schwimmen.", "ml": "Modal ക്രിയകൾക്ക് ശേഷം zu ഇല്ലാതെയാണ് infinitive: Ich kann schwimmen."}], "tip": {"en": "zu + infinitive goes to the END of the sentence — same position as Partizip II in Perfekt.", "ml": "zu + infinitive വാക്യാവസാനത്തിലേക്ക് പോകും — Perfekt-ലെ Partizip II പോലെ."}}, {"id": "relative", "group": "Sentences", "level": "A2", "icon": "🧷", "title": "Relative Clauses (der, die, das)", "en": "A relative clause describes a noun and starts with a relative pronoun — which looks exactly like der/die/das. The verb goes to the end. Nominative: Der Mann, der da steht, ist mein Lehrer. Accusative: Der Mann, den ich sehe, …", "ml": "Relative clause ഒരു നാമത്തെ വിശദീകരിക്കും, ആരംഭിക്കുന്നത് der/die/das പോലെ തോന്നിക്കുന്ന relative pronoun കൊണ്ട്. ക്രിയ അവസാനത്തിൽ. Nominative: Der Mann, der da steht, ist mein Lehrer. Accusative: Der Mann, den ich sehe, …", "blocks": [{"t": "table", "headers": ["Case", "masculine", "feminine", "neuter", "plural"], "rows": [["Nominative", "der", "die", "das", "die"], ["Accusative", "den", "die", "das", "die"], ["Dative", "dem", "der", "dem", "denen"]]}, {"t": "examples", "items": [["Das ist der Mann, der Deutsch lernt.", "This is the man who is learning German."], ["Das ist das Buch, das ich lese.", "This is the book that I am reading."], ["Die Frau, der ich helfe, ist meine Nachbarin.", "The woman whom I help is my neighbour."], ["Ich kenne jemanden, der in Berlin wohnt.", "I know someone who lives in Berlin."]]}, {"t": "note", "en": "After prepositions the relative pronoun takes the preposition's case: der Freund, mit dem ich reise (with whom).", "ml": "Preposition-ന് ശേഷം relative pronoun അതിന്റെ case എടുക്കും: der Freund, mit dem ich reise."}], "tip": {"en": "If the relative pronoun is the subject, it takes the nominative: der Mann, der … (who …).", "ml": "Relative pronoun കർത്താവാണെങ്കിൽ nominative: der Mann, der … (ആര് …)."}}, {"id": "indirectq", "group": "Sentences", "level": "A2", "icon": "🤔", "title": "Indirect Questions (ob, was, wo…)", "en": "Indirect questions report a question inside a sentence. They are introduced by ob (whether/if) for yes/no questions, or by a W-word. The verb goes to the END: Ich weiß nicht, ob er kommt. Ich frage mich, was er macht.", "ml": "Indirect questions ഒരു ചോദ്യത്തെ വാക്യത്തിനുള്ളിൽ റിപ്പോർട്ട് ചെയ്യുന്നു. അതെ/ഇല്ല ചോദ്യങ്ങൾക്ക് ob, മറ്റുള്ളവയ്ക്ക് W-പദം. ക്രിയ അവസാനത്തിൽ: Ich weiß nicht, ob er kommt.", "blocks": [{"t": "table", "headers": ["Direct question", "Indirect question", "മലയാളം"], "rows": [["Kommt er?", "Ich weiß nicht, ob er kommt.", "അവൻ വരുമോ എന്ന് എനിക്കറിയില്ല."], ["Was machst du?", "Er fragt, was ich mache.", "ഞാൻ എന്ത് ചെയ്യുന്നു എന്ന് അവൻ ചോദിക്കുന്നു."], ["Wo wohnst du?", "Sie möchte wissen, wo ich wohne.", "ഞാൻ എവിടെ താമസിക്കുന്നു എന്ന് അവൾക്കറിയണം."], ["Hast du Zeit?", "Ich frage, ob du Zeit hast.", "നിനക്ക് സമയമുണ്ടോ എന്ന് ഞാൻ ചോദിക്കുന്നു."]]}, {"t": "note", "en": "ob = 'whether' for yes/no questions. W-words stay as question words but the verb still goes to the end.", "ml": "ob = അതെ/ഇല്ല ചോദ്യങ്ങൾക്ക്. W-പദങ്ങൾ അതേപടി നിൽക്കും, ക്രിയ അവസാനത്തിലാകും."}], "tip": {"en": "In indirect questions there is NO inversion — verb last, just like weil-clauses.", "ml": "Indirect questions-ൽ inversion ഇല്ല — ക്രിയ അവസാനം, weil-വാക്യങ്ങൾ പോലെ."}}, {"id": "connectors", "group": "Sentences", "level": "A2", "icon": "🔀", "title": "Connectors: deshalb, trotzdem, sondern", "en": "deshalb (therefore) and trotzdem (nevertheless) are adverbs that push the verb to position 2 and the subject after it: Ich bin müde, deshalb gehe ich schlafen. sondern is used after a negation to correct it: nicht … sondern … (not … but …).", "ml": "deshalb (അതുകൊണ്ട്), trotzdem (എങ്കിലും) എന്നിവ ക്രിയയെ രണ്ടാം സ്ഥാനത്ത് നിർത്തി വിഷയത്തെ അതിന് പിന്നിലാക്കും: Ich bin müde, deshalb gehe ich schlafen. sondern നിഷേധത്തിന് ശേഷം തിരുത്താൻ: nicht … sondern … (അല്ല … മറിച്ച് …).", "blocks": [{"t": "table", "headers": ["Connector", "Meaning", "Verb position", "മലയാളം"], "rows": [["deshalb", "therefore", "position 2 (inversion)", "അതുകൊണ്ട്"], ["trotzdem", "nevertheless", "position 2 (inversion)", "എങ്കിലും"], ["sondern", "but rather (after nicht)", "position 2 (normal)", "മറിച്ച്"], ["aber", "but", "position 2 (normal)", "പക്ഷേ"], ["denn", "because (main clause)", "position 2 (normal)", "കാരണം"]]}, {"t": "examples", "items": [["Ich habe Hunger, deshalb esse ich etwas.", "I am hungry, therefore I eat something."], ["Es regnet, trotzdem gehen wir spazieren.", "It is raining, nevertheless we go for a walk."], ["Das ist nicht mein Buch, sondern deins.", "That is not my book, but yours."], ["Er kommt nicht aus Indien, sondern aus Sri Lanka.", "He is not from India, but from Sri Lanka."]]}, {"t": "note", "en": "After deshalb/trotzdem the verb comes FIRST, then the subject: deshalb gehe ich (not: deshalb ich gehe).", "ml": "deshalb/trotzdem ശേഷം ക്രിയ ആദ്യം, പിന്നെ കർത്താവ്: deshalb gehe ich."}], "tip": {"en": "Memory hook: deshalb/trotzdem behave like the verb is in position 2 — the connector itself takes position 1.", "ml": "ഓർമ്മിക്കാൻ: deshalb/trotzdem ഒന്നാം സ്ഥാനത്ത്, ക്രിയ രണ്ടാം സ്ഥാനത്ത്."}}, {"id": "verbprep", "group": "Verbs", "level": "A2", "icon": "🎯", "title": "Verbs with Fixed Prepositions", "en": "Many German verbs are bound to a specific preposition with its own case. Learn them as one unit! warten auf + acc (wait for), sich interessieren für + acc (be interested in), denken an + acc (think of), sich freuen auf + acc (look forward to), fragen nach + dat (ask about), sich kümmern um + acc (take care of).", "ml": "പല ജർമ്മൻ ക്രിയകളും ഒരു പ്രത്യേക preposition-മായി ബന്ധപ്പെട്ടിരിക്കും, അതിന് സ്വന്തം case ഉണ്ട്. ഇവ ഒറ്റയൂണിറ്റായി പഠിക്കുക! warten auf + acc (കാത്തിരിക്കുക), sich interessieren für + acc (താൽപ്പര്യപ്പെടുക), denken an + acc (ഓർക്കുക), sich freuen auf + acc (ആകാംക്ഷയോടെ കാത്തിരിക്കുക), fragen nach + dat (ചോദിക്കുക), sich kümmern um + acc (പരിചരിക്കുക).", "blocks": [{"t": "table", "headers": ["Verb + preposition", "Case", "Example", "മലയാളം"], "rows": [["warten auf", "accusative", "Ich warte auf dich.", "ഞാൻ നിനക്കായി കാത്തിരിക്കുന്നു."], ["sich interessieren für", "accusative", "Er interessiert sich für Sport.", "അവന് സ്പോർട്സിൽ താൽപ്പര്യമുണ്ട്."], ["denken an", "accusative", "Ich denke an dich.", "ഞാൻ നിന്നെക്കുറിച്ച് ഓർക്കുന്നു."], ["sich freuen auf", "accusative", "Wir freuen uns auf das Fest.", "ഞങ്ങൾ ആഘോഷത്തിനായി കാത്തിരിക്കുന്നു."], ["fragen nach", "dative", "Er fragt nach dem Weg.", "അവൻ വഴി ചോദിക്കുന്നു."], ["sich kümmern um", "accusative", "Sie kümmert sich um die Kinder.", "അവൾ കുട്ടികളെ നോക്കുന്നു."]]}, {"t": "note", "en": "These fixed prepositions combine with question words: Worauf wartest du? (What are you waiting for?) — wo(r)+preposition.", "ml": "ഇവ ചോദ്യപദങ്ങളുമായി കൂടിച്ചേരും: Worauf wartest du? — wo(r) + preposition."}], "tip": {"en": "B1 preview: this rule expands a lot (träumen von, sich gewöhnen an…). Start memorising the six above now!", "ml": "B1-ൽ ഇത് വളരെ വികസിക്കും (träumen von, sich gewöhnen an…). മേൽപ്പറഞ്ഞ ആറെണ്ണം ഇപ്പോൾ തന്നെ മനഃപാഠമാക്കൂ!"}}],
  phrases: [{"de": "Hallo!", "en": "Hello!", "ml": "ഹലോ!", "audio": "phrase_01.mp3"}, {"de": "Guten Morgen!", "en": "Good morning!", "ml": "സുപ്രഭാതം!", "audio": "phrase_02.mp3"}, {"de": "Guten Tag!", "en": "Good day!", "ml": "നമസ്കാരം!", "audio": "phrase_03.mp3"}, {"de": "Guten Abend!", "en": "Good evening!", "ml": "ശുഭ സായാഹ്നം!", "audio": "phrase_04.mp3"}, {"de": "Gute Nacht!", "en": "Good night!", "ml": "ശുഭ രാത്രി!", "audio": "phrase_05.mp3"}, {"de": "Danke schön!", "en": "Thank you very much!", "ml": "വളരെ നന്ദി!", "audio": "phrase_06.mp3"}, {"de": "Bitte schön!", "en": "You're welcome!", "ml": "ഒന്നും വേണ്ട / സ്വാഗതം!", "audio": "phrase_07.mp3"}, {"de": "Wie geht es dir? – Mir geht es gut, danke!", "en": "How are you? – I'm fine, thanks!", "ml": "നിനക്ക് സുഖമാണോ? – എനിക്ക് സുഖമാണ്, നന്ദി!", "audio": "phrase_08.mp3"}, {"de": "Auf Wiedersehen!", "en": "Goodbye!", "ml": "വീണ്ടും കാണാം!", "audio": "phrase_09.mp3"}, {"de": "Eins, zwei, drei, vier, fünf, sechs, sieben, acht, neun, zehn.", "en": "One, two, three, four, five, six, seven, eight, nine, ten.", "ml": "ഒന്ന്, രണ്ട്, മൂന്ന്, നാല്, അഞ്ച്, ആറ്, ഏഴ്, എട്ട്, ഒമ്പത്, പത്ത്.", "audio": "phrase_10.mp3"}, {"de": "Ich verstehe nicht.", "en": "I don't understand.", "ml": "എനിക്ക് മനസ്സിലാകുന്നില്ല.", "audio": null}, {"de": "Sprechen Sie Englisch?", "en": "Do you speak English?", "ml": "നിങ്ങൾ ഇംഗ്ലീഷ് സംസാരിക്കുമോ?", "audio": null}, {"de": "Ich lerne Deutsch.", "en": "I am learning German.", "ml": "ഞാൻ ജർമ്മൻ പഠിക്കുന്നു.", "audio": null}, {"de": "Wo ist der Bahnhof?", "en": "Where is the railway station?", "ml": "റെയിൽവേ സ്റ്റേഷൻ എവിടെയാണ്?", "audio": null}, {"de": "Wie viel kostet das?", "en": "How much does that cost?", "ml": "ഇതിന് എത്ര വിലയാണ്?", "audio": "phrase_15.mp3"}, {"de": "Ich möchte ein Wasser, bitte.", "en": "I would like some water, please.", "ml": "എനിക്ക് ഒരു വെള്ളം തരാമോ, ദയവായി.", "audio": null}, {"de": "Bis bald!", "en": "See you soon!", "ml": "ഉടൻ കാണാം!", "audio": null}, {"de": "Ich heiße Anna /* ============ Helpers ============ */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function getWords(){
  const mine = JSON.parse(localStorage.getItem("dt_mywords") || "[]");
  return DATA.vocab.concat(mine);
}
function catName(c){ return CATS[c] || c; }
function myWords(){ try{ return JSON.parse(localStorage.getItem("dt_mywords") || "[]"); }catch(e){ return []; } }
function saveMy(w){ localStorage.setItem("dt_mywords", JSON.stringify(w)); }

/* ============ Render: tabs & header ============ */
function renderTabs(){
  const keys = ["start","daily","grammar","vocab","cards","quiz","phrases","ask"];
  document.getElementById("tabs").innerHTML = keys.map(k=>
    `<button class="tab ${tab===k?'active':''}" onclick="go('${k}')">${t()["tab"+k[0].toUpperCase()+k.slice(1)]}</button>`
  ).join("");
  document.getElementById("btnEn").classList.toggle("active", lang==="en");
  document.getElementById("btnMl").classList.toggle("active", lang==="ml");
}
function go(k){ tab=k; render(); window.scrollTo({top:0}); }
function setLang(l){ lang=l; localStorage.setItem("dt_lang",l); render(); }
function render(){ renderTabs(); document.title = lang==="ml" ? "Deutsch Tutor — ജർമ്മൻ പഠിക്കാം" : "Deutsch Tutor — Learn German"; renderTab(); }
document.getElementById("hSearch").addEventListener("keydown", e=>{
  if(e.key==="Enter"){ vocabQ=e.target.value.trim(); vocabCat="all"; go("vocab"); }
});

function renderLesson(g){
  const u=t();
  const lvl = {"A1":"a1","A2":"a2","B1":"b1"}[g.level]||"a1";
  let html = `<h2>${g.icon} ${esc(g.title)} <span class="badge ${lvl}">${g.level}</span></h2>
    <p class="lead">${lang==="ml"?g.ml:g.en}</p>`;
  g.blocks.forEach(b=>{
    if(b.t==="text") html += `<p class="lead">${lang==="ml"&&b.ml?b.ml:b.en}</p>`;
    else if(b.t==="table") html += `<table><thead><tr>${b.headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    else if(b.t==="examples") html += `<ul class="examples">${b.items.map(i=>`<li><span class="de">${i[0]}</span> — ${i[1]}</li>`).join("")}</ul>`;
    else if(b.t==="note") html += `<div class="note">💬 ${lang==="ml"&&b.ml?b.ml:b.en}</div>`;
  });
  html += `<div class="tip">💡 ${g.tip[lang]}</div>`;
  return html;
}

function startQuiz(){
  const mode=document.getElementById("qmode").value;
  const cat=document.getElementById("qcat").value;
  const n=parseInt(document.getElementById("qcount").value);
  let words=getWords().filter(w=>cat==="all"||w.cat===cat);
  if(mode==="art") words=words.filter(w=>/^(der|die|das) /.test(w.de));
  if(mode==="ml2de"||mode==="de2ml") words=words.filter(w=>w.ml && w.ml.length>1);
  words=shuffle(words).slice(0,n);
  if(words.length<3){ const u=t(); main.innerHTML=`<div class="card empty">${u.quizEmpty}</div>`; quiz=null; return; }
  const questions = words.map(w=>{
    let prompt, correct, pool;
    if(mode==="de2en"){ prompt=w.de; correct=w.en; pool=DATA.vocab.map(x=>x.en); }
    else if(mode==="en2de"){ prompt=w.en; correct=w.de; pool=DATA.vocab.map(x=>x.de); }
    else if(mode==="ml2de"){ prompt=w.ml; correct=w.de; pool=DATA.vocab.map(x=>x.de); }
    else if(mode==="de2ml"){ prompt=w.de; correct=w.ml; pool=DATA.vocab.map(x=>x.ml); }
    else { prompt=w.de.replace(/^(der|die|das) /,""); correct=w.de.split(" ")[0]; pool=["der","die","das"]; }
    pool=pool.filter(x=>x!==correct && x && x.length>1);
    const dist=shuffle(pool).slice(0,3);
    const opts=shuffle([correct,...dist]);
    return {prompt, correct:opts.indexOf(correct), opts, asked:prompt, right:correct};
  });
  quiz={questions, i:0, correct:0, wrong:0, answered:null, mistakes:[], mode};
  render();
}
function answerQuiz(idx){
  const q=quiz.questions[quiz.i];
  quiz.answered=idx;
  if(idx===q.correct) quiz.correct++; else { quiz.wrong++; quiz.mistakes.push(q); }
  render();
}
function finishQuiz(){
  const u=t();
  if(quiz.mode==="daily") markTask("quiz", true);
  const pct=Math.round(quiz.correct/quiz.questions.length*100);
  const review=quiz.mistakes.map(m=>`<div class="vrow"><div class="de">${esc(m.asked)}</div><div class="en" style="color:var(--ok);">→ ${esc(m.right)}</div></div>`).join("");

      ${quiz.mistakes.length?`<div style="text-align:left; margin-top:14px;"><h3>${u.quizReview}</h3>${review}</div>`:`<div class="tip" style="text-align:left;">${u.quizNoMistakes}</div>`}

        ${quiz.mode==="daily" ? `<button class="btn" onclick="go('daily')">🎯 ${u.tabDaily}</button>` : ""}
      </div>
    </div>`;
}

/* ============ Tab: Ask the Tutor (with live translation) ============ */
const INFLECT = {
  ein:"ein — a/an (indefinite article)", einen:"einen — a (masc., Akk.)", einem:"einem — a (Dat.)", eines:"eines — a (Gen.)",
  eine:"eine — a (fem.)", einer:"einer — a (fem. Dat./Gen.)",
  keinen:"keinen — no (Akk.)", keinem:"keinem — no (Dat.)", keiner:"keiner — no (fem.)", keine:"keine — no (fem./Pl.)",
  den:"den — the (masc., Akk.)", dem:"dem — the (Dat.)", des:"des — the (Gen.)",
  mich:"mich — me (Akk.)", dich:"dich — you (Akk.)", mir:"mir — to me (Dat.)", dir:"dir — to you (Dat.)",
  uns:"uns — us (Akk./Dat.)", euch:"euch — you all (Akk./Dat.)", ihn:"ihn — him (Akk.)", ihm:"ihm — to him (Dat.)",
  ihnen:"ihnen — to them / to you (formal) (Dat.)",
  mein:"mein — my", dein:"dein — your", sein:"sein — his", ihr:"ihr — her / their", unser:"unser — our", euer:"euer — your (pl.)"
};
const CONTR = { im:"in dem", am:"an dem", zum:"zu dem", zur:"zu der", ins:"in das", beim:"bei dem", vom:"von dem", aufs:"auf das", übers:"über das" };
const PHRASE_XLATE = {
  "es gibt":{"en":"there is / there are","ml":"ഉണ്ട് (എവിടെയെങ്കിലും)"},
  "es tut mir leid":{"en":"I'm sorry","ml":"ക്ഷമിക്കണം / എനിക്ക് വിഷമമുണ്ട്"},
  "ich möchte":{"en":"I would like","ml":"എനിക്ക് വേണം / ഞാൻ ആഗ്രഹിക്കുന്നു"},
  "wie viel kostet":{"en":"how much does it cost","ml":"എത്ര വിലയാണ്"},
  "ich heiße":{"en":"my name is","ml":"എന്റെ പേര് … ആണ്"}
};
const norm = s => String(s).toLowerCase().replace(/[-.,!?;:"„“()]/g,"").replace(/\s+/g," ").trim();
/* Malayalam consonant skeleton: strips vowel signs/virama so sandhi forms still match */
const ML_VOWELS = /[ംഃ്ിീുൂെേൈൊോൌൗ]/;
const mlSkel = s => [...String(s)].filter(ch=>!ML_VOWELS.test(ch)).join("");
let VFORMS = null;
function verbForms(){
  if(VFORMS) return VFORMS;
  VFORMS = {};
  Object.keys(DATA.conj).forEach(inf=>{
    const o = DATA.conj[inf];
    (o.forms||[]).forEach((f,i)=>{ const n = norm(f); if(n && !VFORMS[n]) VFORMS[n] = inf+" ("+DATA.pron[i]+")"; });
  });
  return VFORMS;
}
function baseOf(de){ return norm(de.split(",")[0]); }
function matchVocabDe(nc){
  // exact, then without leading article
  return getWords().find(x=>baseOf(x.de)===nc)
      || getWords().find(x=>baseOf(x.de).replace(/^(der|die|das) /,"")===nc && /^(der|die|das) /.test(x.de));
}
function lookupAt(tokens, idx){
  const vf = verbForms();
  for(let len=3; len>=1; len--){
    const cand = tokens.slice(idx, idx+len).join(" ").trim();
    const nc = norm(cand);
    if(!nc) continue;
    const w = matchVocabDe(nc);
    if(w) return {len, w, de:cand};
    if(len===1){
      if(CONTR[nc]){
        const parts = CONTR[nc].split(" ").map(p=>{
          const e = getWords().find(x=>baseOf(x.de)===p);
          return e ? e.en : (INFLECT[p] ? INFLECT[p] : "");
        }).filter(Boolean).join(" + ");
        return {len, de:cand, gloss: CONTR[nc]+" → "+parts};
      }
      if(INFLECT[nc]) return {len, de:cand, gloss: INFLECT[nc]};
      if(vf[nc]) return {len, de:cand, gloss: vf[nc]};
      const w2 = getWords().find(x=> (x.en && x.en.split(/\s+/).map(norm).includes(nc))
          || (x.ml && (norm(x.ml)===nc
              || (nc.length>=4 && nc.startsWith(norm(x.ml)))
              || (mlSkel(nc).length>=3 && mlSkel(nc).startsWith(mlSkel(norm(x.ml)))))));
      if(w2) return {len, w:w2, de:cand};
      return {len, de:cand, missing:true};
    }
  }
  return {len:1, de:tokens[idx], missing:true};
}
function translateLive(){
  const box = document.getElementById("ltBox");
  const inp = document.getElementById("aq");
  if(!box || !inp) return;
  const u = t();
  const raw = inp.value;
  if(!raw.trim()){ box.innerHTML=""; return; }
  const ph = DATA.phrases.find(p=>norm(p.de)===norm(raw));
  const xp = PHRASE_XLATE[norm(raw)];
  const tokens = raw.split(/\s+/);
  let i = 0, res = [];
  while(i < tokens.length){ const r = lookupAt(tokens,i); res.push(r); i += r.len; }
  const sentEn = res.map(r=>r.w ? r.w.en : (r.gloss ? r.gloss : r.de)).join(" ");
  const sentMl = res.map(r=>r.w ? r.w.ml : (r.gloss ? r.gloss : r.de)).join(" ");
  let html = `<div class="card" style="margin-top:10px;">
      <div class="muted" style="font-size:11px; letter-spacing:.8px; text-transform:uppercase; font-weight:800;">⚡ ${u.ltTitle}</div>`;
  if(ph || xp){
    const p = ph || {en:xp.en, ml:xp.ml, audio:null};
    html += `<div class="phrase" style="margin-top:8px;"><div class="row">
      ${p.audio ? `<button class="play" onclick="playPhrase('${p.audio}')">▶</button>` : `<div style="width:38px;"></div>`}
      <div style="flex:1;"><div class="de">${esc(raw)}</div><div class="en">${esc(p.en)}</div><div class="ml">${esc(p.ml)}</div></div></div></div>`;
  } else {
    html += `<div class="ltsent">🇬🇧 ${esc(sentEn)}</div>
      <div class="ltsent" style="color:var(--muted); font-weight:500;">🇮🇳 ${esc(sentMl)}</div>
      <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;">
        ${res.map(r=>{
          if(r.w) return `<span class="ltchip"><span class="tok">${formatDe(r.w.de)}</span><span class="gl"> ${esc(r.w.en)}</span>${r.w.ml?`<span class="glm"> · ${esc(r.w.ml)}</span>`:""}</span>`;
          if(r.gloss) return `<span class="ltchip"><span class="tok">${esc(r.de)}</span><span class="glm"> ${esc(r.gloss)}</span></span>`;
          return `<span class="ltchip ltunk"><span class="tok">${esc(r.de)}</span><span class="glm"> …</span></span>`;
        }).join("")}
      </div>`;
  }
  html += `<div class="muted" style="margin-top:8px; font-size:12px;">${u.ltNote}</div></div>`;
  box.innerHTML = html;
}

/* ============ Tab: Daily Practice ============ */
const dstr = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
function todayStr(){ return dstr(new Date()); }
function yesterdayStr(){ const d=new Date(); d.setDate(d.getDate()-1); return dstr(d); }
function loadDaily(){
  try{
    const d = JSON.parse(localStorage.getItem("dt_daily")||"{}");
    return {last:d.last||"", streak:d.streak||0, xp:d.xp||0, tasks:d.tasks||{}};
  }catch(e){ return {last:"", streak:0, xp:0, tasks:{}}; }
}
let daily = loadDaily();
function saveDaily(){ localStorage.setItem("dt_daily", JSON.stringify(daily)); }
function todayTasks(){ return daily.tasks[todayStr()] || {}; }
function markTask(k, silent){
  const ts = todayStr(), tt = todayTasks();
  if(tt[k]) return;
  tt[k] = true;
  daily.tasks[ts] = tt;
  if(daily.last === ts){ /* already counted today */ }
  else if(daily.last === yesterdayStr()) daily.streak++;
  else daily.streak = 1;
  daily.last = ts;
  daily.xp += 10;
  saveDaily();
  if(!silent) render();
}
function markDay(){
  const ts = todayStr();
  if(daily.last !== ts){
    if(daily.last === yesterdayStr()) daily.streak++;
    else daily.streak = 1;
    daily.last = ts;
    daily.xp += 5;
    saveDaily();
  }
  render();
}
function dayOfYear(){
  const now = new Date();
  return Math.floor((now - new Date(now.getFullYear(),0,0)) / 86400000);
}
function makeQuestion(w, mode){
  let prompt, correct, pool;
  if(mode==="de2en"){ prompt=w.de; correct=w.en; pool=DATA.vocab.map(x=>x.en); }
  else if(mode==="en2de"){ prompt=w.en; correct=w.de; pool=DATA.vocab.map(x=>x.de); }
  else if(mode==="ml2de"){ prompt=w.ml; correct=w.de; pool=DATA.vocab.map(x=>x.de); }
  else { prompt=w.de.replace(/^(der|die|das) /,""); correct=w.de.split(" ")[0]; pool=["der","die","das"]; }
  pool = pool.filter(x=>x!==correct && x && x.length>1);
  const dist = shuffle(pool).slice(0,3);
  const opts = shuffle([correct].concat(dist));
  return {prompt, correct:opts.indexOf(correct), opts, asked:prompt, right:correct};
}
function buildDailyQuiz(){
  const modes = ["de2en","en2de","ml2de","art"];
  const words = getWords();
  const qs = [];
  for(let i=0;i<10;i++){
    const mode = modes[i % modes.length];
    let pool = words;
    if(mode==="art") pool = words.filter(w=>/^(der|die|das) /.test(w.de));
    if(mode==="ml2de") pool = pool.filter(w=>w.ml && w.ml.length>1);
    if(!pool.length) pool = words;
    const w = pool[Math.floor(Math.random()*pool.length)];
    qs.push(makeQuestion(w, mode));
  }
  quiz = {questions: qs, i:0, correct:0, wrong:0, answered:null, mistakes:[], mode:"daily"};
  render();
}

      <div class="tip" style="cursor:pointer;" onclick="gramSel='${gramTip.id}';go('grammar')">
